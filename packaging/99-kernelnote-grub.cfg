# Kernelnote performance defaults. Keep all distribution/user arguments and
# append each token only when it is not already present.
case " ${GRUB_CMDLINE_LINUX-} " in
  *" mitigations=off "*) ;;
  *) GRUB_CMDLINE_LINUX="${GRUB_CMDLINE_LINUX:+${GRUB_CMDLINE_LINUX} }mitigations=off" ;;
esac

case " ${GRUB_CMDLINE_LINUX-} " in
  *" nowatchdog "*) ;;
  *) GRUB_CMDLINE_LINUX="${GRUB_CMDLINE_LINUX:+${GRUB_CMDLINE_LINUX} }nowatchdog" ;;
esac
