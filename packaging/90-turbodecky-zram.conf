# Legacy ZRAM compressor profile. The gaming-swap installation policy masks
# ZRAM setup and uses LZ4 zswap with a persistent /home swapfile by default.
# Override a distribution's zram-generator primary compressor before zram0 is
# initialized. With CONFIG_ZRAM_MULTI_COMP, the second algorithm is configured
# as the priority-1 recompressor.
[zram0]
compression-algorithm = lz4 zstd
