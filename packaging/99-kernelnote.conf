# TurboDecky defaults for Marie LRU and ZRAM-IR on Debian/Ubuntu
vm.swappiness = 1
vm.page-cluster = 0
vm.compact_unevictable_allowed = 0
vm.watermark_boost_factor = 0
-kernel.sched_cfs_bandwidth_slice_us = 3000
-kernel.split_lock_mitigate = 0
# Balanced inode/dentry reclaim; avoid extra metadata churn during games.
vm.vfs_cache_pressure = 100
vm.compaction_proactiveness = 10
vm.dirty_expire_centisecs = 1500
vm.dirty_writeback_centisecs = 1500
vm.dirty_ratio = 10
vm.dirty_background_ratio = 2

# ZRAM-IR value 1 means try compressor priorities 0 and 1 immediately.
# The leading '-' keeps sysctl --system non-fatal before the zram module exists;
# the udev helper reasserts the value when a zram device is created.
-vm.zram_recomp_immediate = 1
