# TurboDecky Transparent Hugepage policy.
#
# Use w- rather than w!: these sysfs values are safe to change at runtime,
# should also be applied immediately during package installation, and must not
# make systemd-tmpfiles fail when a kernel does not expose a particular node.
w- /sys/kernel/mm/transparent_hugepage/enabled - - - - madvise
w- /sys/kernel/mm/transparent_hugepage/defrag - - - - defer+madvise
w- /sys/kernel/mm/transparent_hugepage/shmem_enabled - - - - advise
w- /sys/kernel/mm/transparent_hugepage/khugepaged/defrag - - - - 0
w- /sys/kernel/mm/transparent_hugepage/khugepaged/max_ptes_none - - - - 384
w- /sys/kernel/mm/transparent_hugepage/khugepaged/max_ptes_swap - - - - 16
