name: Validate upstream-only cleanup

on:
  push:
    branches:
      - maintenance/upstream-only-bootstrap

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/upstream-only-bootstrap
          fetch-depth: 1

      - name: Apply remaining upstream-only cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 tools/upstream-only-phase2.py

      - name: Validate source tree
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/*.py tools/*.py tests/*.py
          bash -n scripts/build-kernelnote-core.sh scripts/build-kernelnote.sh scripts/validate-dynamic-patches-local.sh
          python3 -m json.tool config/patch-sources.json >/dev/null
          test ! -e patches/bore/7.1.4-bore-6.8.0-rc1.patch
          test ! -e patches/bore/7.1.4-sched-ext-coexistence-fix.patch
          test -s patches/bore/sched-ext-coexistence-template.patch
          test ! -e .github/workflows/update-marie-fallback.yml
          ! grep -R -E '6\.8\.0-rc1|7\.1\.4-sched-ext|linux7\.1-reflex-v0\.3\.2|cgroup-vram-linux7\.1-port' \
            scripts config patches/bore tests --exclude='test_latest_stable_identity.py'
          scripts/validate-dynamic-patches-local.sh
          git diff --check

      - name: Commit validated cleanup on maintenance branch
        shell: bash
        run: |
          set -Eeuo pipefail
          git add scripts/build-kernelnote-core.sh \
            scripts/apply-reflex-core.py \
            scripts/apply-vram-cgroup.py \
            scripts/finalize-bore-stable-port-base.py \
            tests/test_bore_stable_finalizer.py \
            patches/bore/sched-ext-coexistence-template.patch
          git add -u patches/bore
          if git diff --cached --quiet; then
            echo "No phase-two cleanup changes remain"
            exit 0
          fi
          git config user.name "TurboDecky Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Remove historical patch bootstrap identities"
          git push origin HEAD:maintenance/upstream-only-bootstrap
