name: Validate upstream-only cleanup

on:
  push:
    branches:
      - maintenance/upstream-only-bootstrap

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: maintenance/upstream-only-bootstrap
          fetch-depth: 1

      - name: Apply upstream-only source cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("scripts/build-kernelnote.sh")
          text = path.read_text(encoding="utf-8")
          text = text.replace(
              "grep -Fq '#define ZRAM_IR_VERSION \"1.2\"' drivers/block/zram/zram_drv.c",
              'grep -Fq "$PATCH_ZRAM_IR_VERSION" drivers/block/zram/zram_drv.c',
          )
          nap_old = (
              "grep -Fq '#define CPUIDLE_NAP_VERSION  \"0.5.0\"' "
              + "\\\n    drivers/cpuidle/governors/nap/nap.c"
          )
          nap_new = (
              'grep -Fq "$PATCH_NAP_VERSION" '
              + "\\\n    drivers/cpuidle/governors/nap/nap.c"
          )
          text = text.replace(nap_old, nap_new)
          path.write_text(text, encoding="utf-8")

          helper = Path("tools/upstream-only-cleanup.py")
          source = helper.read_text(encoding="utf-8")
          old = r"(?=\n\n  fetch_candidate_patch|\n\n\})"
          new = r"(?=\n\n  fetch_candidate_patch|\n\s*\})"
          if source.count(old) != 1:
              raise SystemExit(f"requested-series terminal regex count={source.count(old)}")
          helper.write_text(source.replace(old, new, 1), encoding="utf-8")
          PY
          python3 tools/upstream-only-cleanup.py

      - name: Validate source tree
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile scripts/*.py tools/upstream-only-cleanup.py
          bash -n scripts/build-kernelnote-core.sh scripts/build-kernelnote.sh scripts/validate-dynamic-patches-local.sh
          python3 -m json.tool config/patch-sources.json >/dev/null
          scripts/validate-dynamic-patches-local.sh
          git diff --check

      - name: Commit validated cleanup on maintenance branch
        shell: bash
        run: |
          set -Eeuo pipefail
          git add config/kernelnote.config \
            scripts/build-kernelnote-core.sh \
            scripts/build-kernelnote.sh \
            scripts/apply-upstream-generic.py \
            scripts/apply-requested-patch-series.py \
            scripts/apply-dynamic-patch-sources.py \
            scripts/apply-zarpon-generic-name.py \
            scripts/validate-dynamic-patches-local.sh
          if git diff --cached --quiet; then
            echo "No cleanup changes remain"
            exit 0
          fi
          git config user.name "TurboDecky Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Require current upstream patch locks"
          git push origin HEAD:maintenance/upstream-only-bootstrap
