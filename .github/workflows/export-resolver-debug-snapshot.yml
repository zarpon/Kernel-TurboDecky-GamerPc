name: Export resolver debug snapshot

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    if: github.head_ref == 'validation/patch-resolver-hardening-20260727'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Package resolver sources and tests
        run: |
          set -Eeuo pipefail
          zip -qr resolver-debug-snapshot.zip scripts tests config
      - name: Upload snapshot
        uses: actions/upload-artifact@v4
        with:
          name: gamerpc-resolver-debug-snapshot
          path: resolver-debug-snapshot.zip
          if-no-files-found: error
          retention-days: 3
