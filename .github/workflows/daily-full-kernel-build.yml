name: Daily full kernel build

on:
  schedule:
    # Avoid minute 00: GitHub documents higher scheduled-workflow load at the start of each hour.
    # 03:17 UTC = 00:17 America/Sao_Paulo (Brasilia).
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  dispatch-full-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Trigger full kernel package build and publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh workflow run validate-kernel.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f publish_release=true
