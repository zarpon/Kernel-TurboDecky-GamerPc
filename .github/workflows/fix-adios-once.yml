name: One-time ADIOS duplicate-hunk correction

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Apply deterministic ADIOS correction
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('scripts/build-kernelnote-core.sh')
          text = path.read_text(encoding='utf-8')

          old = '''  mapfile -t rejects < <(find "$KERNELDIR" -name '*.rej' -printf '%P\\n' | sort)
          expected=("block/elevator.c.rej")

          if [[ "${rejects[*]}" != "${expected[*]}" ]]; then
            echo "Unexpected ADIOS rejects: ${rejects[*]:-none}" >&2
            return 1
          fi

          python3 "$ROOT/scripts/apply-adios-default-elevator-port.py" "$KERNELDIR"
          '''
          new = '''  # ADIOS and Marie both carry the same setlocalversion identity hunk in
          # current upstream releases. Accept that reject only when the ADIOS hunk is
          # provably already present; any real content mismatch still fails closed.
          if [[ -f "$KERNELDIR/scripts/setlocalversion.rej" ]]; then
            if filterdiff -i '*/scripts/setlocalversion' "$file" | \\
                patch --batch --reverse --dry-run --strip=1 \\
                  > "$LOGDIR/03-adios-setlocalversion-already-applied.log" 2>&1; then
              echo "==> ADIOS setlocalversion hunk already present; preserving equivalent upstream change"
              rm -f "$KERNELDIR/scripts/setlocalversion.rej" "$KERNELDIR/scripts/setlocalversion.orig"
            else
              cat "$LOGDIR/03-adios-setlocalversion-already-applied.log" >&2 || true
              echo "ADIOS setlocalversion reject is not an already-applied equivalent hunk" >&2
              return 1
            fi
          fi

          mapfile -t rejects < <(find "$KERNELDIR" -name '*.rej' -printf '%P\\n' | sort)
          expected=("block/elevator.c.rej")

          if [[ "${rejects[*]}" != "${expected[*]}" ]]; then
            echo "Unexpected ADIOS rejects: ${rejects[*]:-none}" >&2
            return 1
          fi

          python3 "$ROOT/scripts/apply-adios-default-elevator-port.py" "$KERNELDIR"
          '''
          if text.count(old) != 1:
              raise SystemExit(f'ADIOS reject anchor count was {text.count(old)}, expected 1')
          text = text.replace(old, new, 1)

          if text.count('ADIOS_URL="https://raw.githubusercontent.com/firelzrd/adios/08bf078aac99075a0bef73c2b2497574a82e4c41/patches/stable/0001-linux6.19.3-ADIOS-3.2.0.patch"') != 1:
              raise SystemExit('stale ADIOS bootstrap assignment anchor missing')
          text = text.replace(
              'ADIOS_URL="https://raw.githubusercontent.com/firelzrd/adios/08bf078aac99075a0bef73c2b2497574a82e4c41/patches/stable/0001-linux6.19.3-ADIOS-3.2.0.patch"',
              'ADIOS_URL="__DYNAMIC_PATCH_LOCK_REQUIRED__"',
              1,
          )
          text = text.replace('0003-adios-3.2.0.patch', '0003-adios-current.patch')
          path.write_text(text, encoding='utf-8')

          # Keep tests synchronized with the version-neutral workspace filename only.
          for test in Path('tests').glob('*.py'):
              src = test.read_text(encoding='utf-8')
              if '0003-adios-3.2.0.patch' in src:
                  test.write_text(src.replace('0003-adios-3.2.0.patch', '0003-adios-current.patch'), encoding='utf-8')

          self_path = Path('.github/workflows/fix-adios-once.yml')
          self_path.unlink()
          PY

          bash -n scripts/build-kernelnote-core.sh
          python3 -m py_compile scripts/*.py tests/*.py
          scripts/validate-dynamic-patches-local.sh
          if grep -Rni --exclude-dir=.git --exclude-dir=work --exclude-dir=logs 'adios-3\.2\.0\|ADIOS-3\.2\.0' .; then
            echo 'Stale ADIOS 3.2.0 reference remains' >&2
            exit 1
          fi
          git diff --check

      - name: Commit correction
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "TurboDecky Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Handle duplicate ADIOS localversion hunk safely"
          git push origin HEAD:main

      - name: Start corrective full release build
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          sleep 3
          gh workflow run validate-kernel.yml --repo "$GITHUB_REPOSITORY" --ref main --field publish_release=true
