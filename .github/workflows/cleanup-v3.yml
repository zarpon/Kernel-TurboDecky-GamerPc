name: Finalize legacy base cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Apply validated migration and align Zen ordering test
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          workflows = Path('.github/workflows')
          candidates = []
          for path in workflows.glob('*.yml'):
              text = path.read_text(encoding='utf-8')
              if text.startswith('name: Complete legacy base removal\n'):
                  candidates.append((path, text))
          if len(candidates) != 1:
              raise SystemExit(f'expected one migration workflow, found {len(candidates)}')

          source_path, source = candidates[0]
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          block = source[start:end]
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in block.splitlines()
          ) + '\n'
          migration = Path('/tmp/legacy-base-migration.py')
          migration.write_text(script, encoding='utf-8')

          # Remove this transient workflow from the working tree before the
          # migration's repository-wide forbidden-reference scan runs.
          self_path = Path('.github/workflows/cleanup-v3.yml')
          self_path.unlink()
          subprocess.run(['python3', str(migration)], check=True)

          test_path = Path('tests/test_zen_interactive_rewriter.py')
          text = test_path.read_text(encoding='utf-8')
          old = (
              '                "fetch_requested_patch_series\\nfetch_reflex_patch\\n\\n"\n'
              '                "fetch_zen_interactive_profile\\n\\ncd \\\"$KERNELDIR\\\"",\n'
          )
          new = (
              '                "fetch_requested_patch_series\\nfetch_reflex_patch\\n"\n'
              '                \'download "$ADIOS_URL" "$PATCHDIR/0003-adios-3.2.0.patch"\\n\\n\'\n'
              '                "fetch_zen_interactive_profile\\n\\ncd \\\"$KERNELDIR\\\"",\n'
          )
          if text.count(old) != 1:
              raise SystemExit(f'expected one Zen ordering assertion, found {text.count(old)}')
          test_path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

          python3 -m json.tool config/patch-sources.json >/dev/null
          python3 -m py_compile scripts/*.py tests/*.py
          bash -n scripts/build-kernelnote-core.sh scripts/build-kernelnote.sh scripts/validate-dynamic-patches-local.sh
          scripts/validate-dynamic-patches-local.sh
          git diff --check

          if grep -RniE 'liquorix|(^|[^[:alnum:]])lqx([^[:alnum:]]|$)' \
              --exclude-dir=.git --exclude-dir=work --exclude-dir=logs --exclude-dir=__pycache__ .; then
            echo 'Legacy external-base references remain after cleanup' >&2
            exit 1
          fi

      - name: Commit atomic cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "TurboDecky Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Remove legacy external base from TurboDecky build"
          git push origin HEAD:main

      - name: Start corrective full package and release build
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh workflow run validate-kernel.yml --repo "$GITHUB_REPOSITORY" --ref main --field publish_release=true
