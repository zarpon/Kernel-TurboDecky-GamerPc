name: Validate transactional BORE migration

on:
  pull_request:
    branches: [validation/bore-migration-base]

permissions:
  contents: write

concurrency:
  group: bore-migration-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  migrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out proposed branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Transform, validate and commit BORE migration
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x scripts/validate-dynamic-patches-local.sh
          scripts/validate-dynamic-patches-local.sh

      - name: Confirm clean validated checkout
        shell: bash
        run: |
          set -Eeuo pipefail
          git diff --check
          git status --short
