name: Validate Kernelnote kernel

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: Build mode
        required: true
        default: validate
        type: choice
        options:
          - validate
          - package

permissions:
  contents: write

concurrency:
  group: kernelnote-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      BUILD_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || github.head_ref == 'experimental/linux-7.1.3-lqx-marie-adios' && 'package' || 'validate' }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 8G
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_NOHASHDIR: "true"
      KBUILD_BUILD_USER: kernelnote
      KBUILD_BUILD_HOST: github-actions
      KBUILD_BUILD_TIMESTAMP: "2026-01-01 00:00:00 UTC"
      KBUILD_BUILD_VERSION: "1"
      SOURCE_DATE_EPOCH: "1767225600"
      LC_ALL: C
      TZ: UTC
    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Check out project
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Configure CPU and zswap
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p logs
          exec > >(tee -a logs/ci-resources.log) 2>&1

          JOBS="$(nproc --all)"
          echo "JOBS=$JOBS" >> "$GITHUB_ENV"
          echo "MAKEFLAGS=-j$JOBS" >> "$GITHUB_ENV"

          configure_zswap() {
            local parameters=/sys/module/zswap/parameters

            sudo modprobe zswap 2>/dev/null || true
            sudo modprobe zstd_compress 2>/dev/null || true
            sudo modprobe crypto_zstd 2>/dev/null || true
            sudo modprobe zstd 2>/dev/null || true

            if [[ ! -d "$parameters" ]]; then
              echo "::warning::The host kernel does not expose runtime zswap parameters; continuing with disk swap only"
              return 0
            fi

            if ! printf '%s\n' zstd | sudo tee "$parameters/compressor" >/dev/null; then
              printf '%s\n' N | sudo tee "$parameters/enabled" >/dev/null || true
              printf '%s\n' zstd | sudo tee "$parameters/compressor" >/dev/null || true
            fi
            printf '%s\n' 30 | sudo tee "$parameters/max_pool_percent" >/dev/null || true
            printf '%s\n' Y | sudo tee "$parameters/enabled" >/dev/null || true

            local enabled compressor pool
            enabled="$(cat "$parameters/enabled")"
            compressor="$(cat "$parameters/compressor")"
            pool="$(cat "$parameters/max_pool_percent")"

            if [[ "$enabled" != "Y" || "$compressor" != "zstd" || "$pool" != "30" ]]; then
              echo "::warning::Requested zswap settings were not fully accepted by the host kernel: enabled=$enabled compressor=$compressor pool=$pool"
            fi
          }

          configure_zswap
          echo "Detected logical CPUs: $JOBS"
          echo "Configured MAKEFLAGS: -j$JOBS"

      - name: Configure 16 GiB swap
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761
        with:
          swap-size-gb: 16

      - name: Verify build resources
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a logs/ci-resources.log) 2>&1

          echo "Memory and swap:"
          free -h
          echo
          swapon --show
          echo
          df -h /

          SWAP_BYTES="$(swapon --noheadings --show=SIZE --bytes | awk '{total += $1} END {print total + 0}')"
          MIN_SWAP_BYTES=$((15 * 1024 * 1024 * 1024))
          if (( SWAP_BYTES < MIN_SWAP_BYTES )); then
            echo "Configured swap is smaller than expected: $SWAP_BYTES bytes" >&2
            exit 1
          fi

          if [[ -d /sys/module/zswap/parameters ]]; then
            printf 'zswap enabled: '
            cat /sys/module/zswap/parameters/enabled
            printf 'zswap compressor: '
            cat /sys/module/zswap/parameters/compressor
            printf 'zswap maximum pool: '
            cat /sys/module/zswap/parameters/max_pool_percent
          fi

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: kernelnote-thinlto-v4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-kernelnote.sh', 'scripts/apply-*.py', 'config/kernelnote.config') }}
          restore-keys: |
            kernelnote-thinlto-v4-${{ runner.os }}-${{ runner.arch }}-
            kernelnote-thinlto-v3-${{ runner.os }}-${{ runner.arch }}-

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache clang cpio curl debhelper diffstat dpkg-dev fakeroot flex git \
            kmod libdw-dev libelf-dev libssl-dev lld llvm pahole patchutils python3 rsync xz-utils zstd

          # bindeb-pkg generates Build-Depends on debhelper-compat (= 12) and
          # libdw-dev:native. Ubuntu's debhelper package provides the requested
          # compatibility levels, while libdw-dev supplies the native DWARF API.
          dpkg-query -W -f='${binary:Package} ${Version}\n' debhelper libdw-dev | tee logs/package-build-dependencies.txt

          ccache --set-config=max_size="$CCACHE_MAXSIZE"
          ccache --set-config=compression=true
          ccache --set-config=compiler_check=content
          ccache --set-config=base_dir="$CCACHE_BASEDIR"
          ccache --set-config=hash_dir=false
          ccache --zero-stats
          clang --version
          ld.lld --version
          llvm-ar --version | head -n 1
          ccache --version | head -n 1
          interdiff --version | head -n 1

      - name: Configure cached CI toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.ci-bin"

          cat > "$GITHUB_WORKSPACE/.ci-bin/clang" <<'EOF'
          #!/usr/bin/env bash
          exec ccache /usr/bin/clang "$@"
          EOF

          chmod +x "$GITHUB_WORKSPACE/.ci-bin/clang"
          echo "$GITHUB_WORKSPACE/.ci-bin" >> "$GITHUB_PATH"

      - name: Prepare and build ThinLTO kernel
        run: |
          chmod +x scripts/build-kernelnote.sh scripts/build-tuning-package.sh
          scripts/build-kernelnote.sh "$BUILD_MODE"

      - name: Show compiler cache statistics
        if: always()
        run: ccache --show-stats --verbose || true

      - name: Prepare package release files
        if: ${{ env.BUILD_MODE == 'package' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          packages=(artifacts/*.deb)
          if (( ${#packages[@]} == 0 )); then
            echo "No Debian packages were produced" >&2
            exit 1
          fi
          (
            cd artifacts
            sha256sum -- *.deb > SHA256SUMS
          )
          ls -lh artifacts
          cat artifacts/SHA256SUMS

      - name: Upload Debian packages
        if: ${{ env.BUILD_MODE == 'package' }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-7.1.3-lqx-marie-bore-adios-thinlto-debs
          path: |
            artifacts/*.deb
            artifacts/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

      - name: Publish GitHub release
        if: ${{ env.BUILD_MODE == 'package' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TARGET: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          packages=(artifacts/*.deb)
          short_sha="${RELEASE_TARGET:0:7}"
          tag="kernelnote-7.1.3-lqx1-marie-0.7.7-${short_sha}"
          title="Kernelnote Linux 7.1.3 Liquorix + Marie 0.7.7"

          cat > release-notes.md <<EOF
          Experimental AMD64 kernel for LMDE 7 / Debian 13.

          Components:
          - Linux 7.1.3 / Liquorix v7.1.3-lqx1
          - Marie LRU 0.7.7 testing, pinned at 4d57ede4ab9b2000ae9ddc25714b8ac219671d35
          - BORE 6.8.0-rc1
          - ADIOS 3.2.0
          - Clang/LLVM ThinLTO

          Source commit: ${RELEASE_TARGET}
          GitHub Actions run: ${GITHUB_RUN_ID}

          Install the image and headers packages together. SHA-256 checksums are included in SHA256SUMS.
          EOF

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${packages[@]}" artifacts/SHA256SUMS \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "${packages[@]}" artifacts/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_TARGET" \
              --title "$title" \
              --notes-file release-notes.md
          fi

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernelnote-validation-logs
          path: logs/
          if-no-files-found: warn
