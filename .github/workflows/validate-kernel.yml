name: Validate Kernelnote kernel

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: Build mode
        required: true
        default: validate
        type: choice
        options:
          - validate
          - package

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      BUILD_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'validate' }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 8G
      CCACHE_COMPILERCHECK: content
      CCACHE_NOHASHDIR: "true"
      KBUILD_BUILD_USER: kernelnote
      KBUILD_BUILD_HOST: github-actions
      KBUILD_BUILD_TIMESTAMP: "2026-01-01 00:00:00 UTC"
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Configure build resources
        shell: bash
        run: |
          set -Eeuo pipefail

          JOBS="$(nproc --all)"
          echo "JOBS=$JOBS" >> "$GITHUB_ENV"
          echo "MAKEFLAGS=-j$JOBS" >> "$GITHUB_ENV"

          sudo fallocate -l 16G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

          if [[ ! -d /sys/module/zswap/parameters ]]; then
            echo "The host kernel does not expose runtime zswap parameters" >&2
            exit 1
          fi

          echo zstd | sudo tee /sys/module/zswap/parameters/compressor
          echo 30 | sudo tee /sys/module/zswap/parameters/max_pool_percent
          echo Y | sudo tee /sys/module/zswap/parameters/enabled

          echo "Detected logical CPUs: $JOBS"
          echo "Configured MAKEFLAGS: -j$JOBS"
          swapon --show
          free -h
          printf 'zswap enabled: '
          cat /sys/module/zswap/parameters/enabled
          printf 'zswap compressor: '
          cat /sys/module/zswap/parameters/compressor
          printf 'zswap maximum pool: '
          cat /sys/module/zswap/parameters/max_pool_percent

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: kernelnote-thinlto-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-kernelnote.sh', 'scripts/apply-*.py', 'config/kernelnote.config') }}
          restore-keys: |
            kernelnote-thinlto-${{ runner.os }}-${{ runner.arch }}-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache clang cpio curl dpkg-dev fakeroot flex git \
            kmod libelf-dev libssl-dev lld llvm pahole python3 rsync xz-utils zstd
          ccache --set-config=max_size="$CCACHE_MAXSIZE"
          ccache --set-config=compression=true
          ccache --zero-stats
          clang --version
          ld.lld --version
          llvm-ar --version | head -n 1
          ccache --version | head -n 1

      - name: Configure cached CI toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.ci-bin"

          cat > "$GITHUB_WORKSPACE/.ci-bin/clang" <<'EOF'
          #!/usr/bin/env bash
          exec ccache /usr/bin/clang "$@"
          EOF

          cat > "$GITHUB_WORKSPACE/.ci-bin/make" <<'EOF'
          #!/usr/bin/env bash
          set -Eeuo pipefail
          args=()
          for arg in "$@"; do
            if [[ "${BUILD_MODE:-validate}" == "validate" && "$arg" == "modules" ]]; then
              echo "CI validation: skipping the complete external module target"
              continue
            fi
            args+=("$arg")
          done
          exec /usr/bin/make "${args[@]}"
          EOF

          chmod +x "$GITHUB_WORKSPACE/.ci-bin/clang" "$GITHUB_WORKSPACE/.ci-bin/make"
          echo "$GITHUB_WORKSPACE/.ci-bin" >> "$GITHUB_PATH"

      - name: Prepare and build ThinLTO kernel
        run: |
          chmod +x scripts/build-kernelnote.sh scripts/build-tuning-package.sh
          scripts/build-kernelnote.sh "$BUILD_MODE"

      - name: Show compiler cache statistics
        if: always()
        run: ccache --show-stats --verbose || true

      - name: Upload Debian packages
        if: ${{ env.BUILD_MODE == 'package' }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-7.1.3-lqx-marie-bore-adios-thinlto-debs
          path: artifacts/*.deb
          if-no-files-found: error

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernelnote-validation-logs
          path: logs/
          if-no-files-found: warn
