name: Validate Liquorix Marie kernel

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: Build mode
        required: true
        default: validate
        type: choice
        options:
          - validate
          - package

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      BUILD_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'validate' }}
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential cpio curl dpkg-dev fakeroot flex \
            kmod libelf-dev libssl-dev pahole python3 rsync xz-utils zstd

      - name: Prepare and build kernel
        run: |
          chmod +x scripts/build-lqx-marie.sh
          scripts/build-lqx-marie.sh "$BUILD_MODE"

      - name: Upload Debian packages
        if: ${{ env.BUILD_MODE == 'package' }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-7.1.3-lqx-marie-debs
          path: artifacts/*.deb
          if-no-files-found: error

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs
          path: logs/
          if-no-files-found: warn
