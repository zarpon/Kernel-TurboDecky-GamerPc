name: Validate Kernelnote kernel

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      mode:
        description: Build mode
        required: true
        default: validate
        type: choice
        options:
          - validate
          - package

permissions:
  contents: write

concurrency:
  group: kernelnote-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BUILD_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || github.head_ref == 'experimental/linux-7.1.3-lqx-marie-adios' && 'package' || 'validate' }}
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_MAXSIZE: 8G
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_NOHASHDIR: "true"
      CCACHE_SLOPPINESS: include_file_ctime,include_file_mtime,time_macros
      KBUILD_BUILD_USER: kernelnote
      KBUILD_BUILD_HOST: github-actions
      KBUILD_BUILD_TIMESTAMP: "2026-01-01 00:00:00 UTC"
      KBUILD_BUILD_VERSION: "1"
      SOURCE_DATE_EPOCH: "1767225600"
      LC_ALL: C
      TZ: UTC

    steps:
      - name: Free /opt runner space
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo find /opt -maxdepth 1 -mindepth 1 \
            ! -path /opt/containerd \
            ! -path /opt/actionarchivecache \
            ! -path /opt/runner \
            ! -path /opt/runner-cache \
            -print -exec rm -rf -- {} +

      - name: Free tool cache
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.1
        with:
          tool-cache: true

      - name: Check out project
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Configure CPU and zswap
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p logs
          exec > >(tee -a logs/ci-resources.log) 2>&1

          JOBS="$(nproc --all)"
          echo "JOBS=$JOBS" >> "$GITHUB_ENV"
          echo "MAKEFLAGS=-j$JOBS" >> "$GITHUB_ENV"

          # Match the proven linux-charcoal-TD host setup exactly: ZSTD, a 90%
          # pool, the zswap shrinker enabled, and zswap enabled before swap is
          # created. GitHub's host kernel exposes these as runtime parameters.
          parameters=/sys/module/zswap/parameters
          test -d "$parameters"
          test -e "$parameters/compressor"
          test -e "$parameters/max_pool_percent"
          test -e "$parameters/shrinker_enabled"
          test -e "$parameters/enabled"

          echo zstd | sudo tee "$parameters/compressor"
          echo 90   | sudo tee "$parameters/max_pool_percent"
          echo 1    | sudo tee "$parameters/shrinker_enabled"
          echo 1    | sudo tee "$parameters/enabled"

          enabled="$(cat "$parameters/enabled")"
          compressor="$(cat "$parameters/compressor")"
          pool="$(cat "$parameters/max_pool_percent")"
          shrinker="$(cat "$parameters/shrinker_enabled")"

          case "$enabled" in Y|1) ;; *) echo "zswap was not enabled: $enabled" >&2; exit 1 ;; esac
          [[ "$compressor" == "zstd" ]]
          [[ "$pool" == "90" ]]
          case "$shrinker" in Y|1) ;; *) echo "zswap shrinker was not enabled: $shrinker" >&2; exit 1 ;; esac

          echo "Detected logical CPUs: $JOBS"
          echo "Configured MAKEFLAGS: -j$JOBS"

      - name: Configure 16 GiB swap
        uses: pierotofy/set-swap-space@fc79b3f67fa8a838184ce84a674ca12238d2c761
        with:
          swap-size-gb: 16

      - name: Verify build resources
        shell: bash
        run: |
          set -Eeuo pipefail
          exec > >(tee -a logs/ci-resources.log) 2>&1

          echo "Memory and swap:"
          free -h
          echo
          swapon --show
          echo
          df -h /

          SWAP_BYTES="$(swapon --noheadings --show=SIZE --bytes | awk '{total += $1} END {print total + 0}')"
          MIN_SWAP_BYTES=$((15 * 1024 * 1024 * 1024))
          if (( SWAP_BYTES < MIN_SWAP_BYTES )); then
            echo "Configured swap is smaller than expected: $SWAP_BYTES bytes" >&2
            exit 1
          fi

          parameters=/sys/module/zswap/parameters
          printf 'zswap enabled: '
          cat "$parameters/enabled"
          printf 'zswap compressor: '
          cat "$parameters/compressor"
          printf 'zswap maximum pool: '
          cat "$parameters/max_pool_percent"
          printf 'zswap shrinker: '
          cat "$parameters/shrinker_enabled"

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: kernelnote-thinlto-v6-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build-kernelnote*.sh', 'scripts/apply-*.py', 'config/kernelnote.config') }}
          restore-keys: |
            kernelnote-thinlto-v6-${{ runner.os }}-${{ runner.arch }}-
            kernelnote-thinlto-v5-${{ runner.os }}-${{ runner.arch }}-
            kernelnote-thinlto-v4-${{ runner.os }}-${{ runner.arch }}-
            kernelnote-thinlto-v3-${{ runner.os }}-${{ runner.arch }}-

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -Eeuo pipefail
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache clang cpio curl debhelper diffstat dpkg-dev fakeroot flex git \
            kmod libdw-dev libelf-dev libssl-dev lld llvm pahole patchutils python3 rsync xz-utils zstd

          dpkg-query -W -f='${binary:Package} ${Version}\n' debhelper libdw-dev \
            | tee logs/package-build-dependencies.txt

          ccache --set-config=max_size="$CCACHE_MAXSIZE"
          ccache --set-config=compression=true
          ccache --set-config=compiler_check=content
          ccache --set-config=base_dir="$CCACHE_BASEDIR"
          ccache --set-config=hash_dir=false
          ccache --set-config=depend_mode=true
          ccache --set-config=sloppiness="$CCACHE_SLOPPINESS"
          ccache --zero-stats

          clang --version
          ld.lld --version
          llvm-ar --version | head -n 1
          ccache --version | head -n 1

      - name: Configure cached CI toolchain
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$GITHUB_WORKSPACE/.ci-bin"

          cat > "$GITHUB_WORKSPACE/.ci-bin/clang" <<'EOF'
          #!/usr/bin/env bash
          exec ccache /usr/bin/clang "$@"
          EOF

          chmod +x "$GITHUB_WORKSPACE/.ci-bin/clang"
          echo "$GITHUB_WORKSPACE/.ci-bin" >> "$GITHUB_PATH"

      - name: Prepare and build ThinLTO kernel
        run: |
          python3 scripts/apply-reflex-core.py scripts/build-kernelnote-core.sh scripts/build-kernelnote.sh
          chmod +x scripts/build-kernelnote.sh scripts/build-kernelnote-core.sh scripts/build-tuning-package.sh
          scripts/build-kernelnote.sh "$BUILD_MODE"

      - name: Show compiler cache statistics
        if: always()
        run: ccache --show-stats --verbose || true

      - name: Prepare package release files
        if: ${{ env.BUILD_MODE == 'package' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          packages=(artifacts/*.deb)
          if (( ${#packages[@]} == 0 )); then
            echo "No Debian packages were produced" >&2
            exit 1
          fi
          (
            cd artifacts
            sha256sum -- *.deb > SHA256SUMS
          )
          ls -lh artifacts
          cat artifacts/SHA256SUMS

      - name: Upload Debian packages
        if: ${{ env.BUILD_MODE == 'package' }}
        uses: actions/upload-artifact@v4
        with:
          name: linux-7.1.3-lqx-marie-bore-poc-nap-reflex-adios-zramir-thinlto-debs
          path: |
            artifacts/*.deb
            artifacts/SHA256SUMS
          if-no-files-found: error
          compression-level: 0

      - name: Publish GitHub release
        if: ${{ env.BUILD_MODE == 'package' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TARGET: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -Eeuo pipefail
          shopt -s nullglob
          packages=(artifacts/*.deb)
          short_sha="${RELEASE_TARGET:0:7}"
          tag="kernelnote-7.1.3-lqx1-poc-nap-reflex-${short_sha}"
          title="Kernelnote Linux 7.1.3 Liquorix + POC + NAP + REFLEX"

          cat > release-notes.md <<EOF
          Experimental AMD64 kernel for LMDE 7 / Debian 13.

          Components:
          - Linux 7.1.3 / Liquorix v7.1.3-lqx1
          - Marie LRU 0.7.7 testing
          - BORE 6.8.0-rc1
          - POC Selector 2.6.2r2, native Linux 7.1 patch
          - NAP CPUIdle governor 0.5.0, ported from the stable Linux 6.18.3 patch
          - REFLEX CPUFreq governor 0.3.1, native Linux 7.1 patch and kernel default
          - ADIOS 3.2.0
          - ZRAM-IR 1.2 with LZ4 -> ZSTD
          - Clang/LLVM ThinLTO
          - mitigations=off nowatchdog cpuidle.governor=nap

          REFLEX is built in and selected by CONFIG_CPU_FREQ_DEFAULT_GOV_REFLEX=y.
          The existing intel_pstate=disable/amd_pstate=disable policy keeps an
          external CPUFreq driver path available on the target notebook.

          DWARF/BTF debug information is intentionally disabled to keep the
          hosted build and package size practical. The kernel image, modules,
          headers and runtime symbols remain included.

          Source commit: ${RELEASE_TARGET}
          GitHub Actions run: ${GITHUB_RUN_ID}

          Install the image and headers packages together. SHA-256 checksums are included in SHA256SUMS.
          EOF

          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" "${packages[@]}" artifacts/SHA256SUMS \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" "${packages[@]}" artifacts/SHA256SUMS \
              --repo "$GITHUB_REPOSITORY" \
              --target "$RELEASE_TARGET" \
              --title "$title" \
              --notes-file release-notes.md
          fi

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kernelnote-validation-logs
          path: logs/
          if-no-files-found: warn
