name: Diagnose final resolver commit

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  diagnose:
    if: github.head_ref == 'validation/patch-resolver-hardening-20260727'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Run complete correction and capture commit output
        id: commit
        continue-on-error: true
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -u
          status=0
          {
            set -Eeuo pipefail
            python3 scripts/stage-resolver-distance-fix.py
            python3 -m py_compile scripts/resolve-patch-sources.py scripts/apply-reflex-core.py tests/test_dynamic_patch_resolver.py tests/test_bore_liquorix_port.py
            scripts/validate-dynamic-patches-local.sh
            git diff --check
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git status --short
            git add scripts/resolve-patch-sources.py scripts/apply-reflex-core.py tests/test_dynamic_patch_resolver.py tests/test_bore_liquorix_port.py
            git diff --cached --stat
            git commit -m "Fix nearest kernel patch ordering"
            git push origin "HEAD:$HEAD_BRANCH"
          } > final-resolver-commit-debug.log 2>&1 || status=$?
          cat final-resolver-commit-debug.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
      - name: Upload commit diagnostic log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gamerpc-final-resolver-commit-debug
          path: final-resolver-commit-debug.log
          if-no-files-found: error
          retention-days: 3
      - name: Fail when commit failed
        if: steps.commit.outputs.status != '0'
        run: exit 1
