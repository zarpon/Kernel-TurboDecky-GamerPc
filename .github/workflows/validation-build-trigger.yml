name: Trigger isolated full build validation

on:
  push:
    branches:
      - validation/fix-build-20260820

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch full kernel build on validation branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh workflow run validate-kernel.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref validation/fix-build-20260820 \
            --field publish_release=false
