name: Correct kernel resolver distance ordering

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-and-test:
    if: github.head_ref == 'validation/patch-resolver-hardening-20260727'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Correct resolver and tests
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          resolver = Path('scripts/resolve-patch-sources.py')
          text = resolver.read_text(encoding='utf-8')
          old = '''def kernel_distance(target: KernelVersion, kernel: KernelVersion) -> int:
              left = target.parts + (0,) * (3 - len(target.parts))
              right = kernel.parts + (0,) * (3 - len(kernel.parts))
              return (
                  abs(left[0] - right[0]) * 1_000_000
                  + abs(left[1] - right[1]) * 1_000
                  + abs(left[2] - right[2])
              )
          '''
          new = '''def kernel_distance(target: KernelVersion, kernel: KernelVersion) -> int:
              left = target.parts + (0,) * (3 - len(target.parts))
              right = kernel.parts + (0,) * (3 - len(kernel.parts))
              # Compare a monotonic kernel-version ordinal. Component-wise absolute
              # differences incorrectly rank 6.18 closer to 7.1 than 6.19.
              left_ordinal = left[0] * 1_000_000 + left[1] * 1_000 + left[2]
              right_ordinal = right[0] * 1_000_000 + right[1] * 1_000 + right[2]
              return abs(left_ordinal - right_ordinal)
          '''
          if text.count(old) != 1:
              raise SystemExit(f'kernel_distance anchor count: {text.count(old)}')
          text = text.replace(old, new, 1)
          old = '''    target = extract_kernel_target(path)
              compat_rank, distance_rank = compatibility_score(target, kernel)
              channel_rank = 2 if "/stable/" in f"/{path}" else 1 if "/testing/" in f"/{path}" else 0
              version = project_version(path, version_pattern)
              return compat_rank, distance_rank, version_key(version), channel_rank, path
          '''
          new = '''    target = extract_kernel_target(path)
              compat_rank, distance_rank = compatibility_score(target, kernel)
              target_parts = target.parts if target else ()
              channel_rank = 2 if "/stable/" in f"/{path}" else 1 if "/testing/" in f"/{path}" else 0
              version = project_version(path, version_pattern)
              # Prefer the newer kernel target when distance is exactly tied (for
              # example Linux 7.2 over 7.0 for a Linux 7.1 build), then the newest
              # project release within that compatibility class.
              return compat_rank, distance_rank, target_parts, version_key(version), channel_rank, path
          '''
          if text.count(old) != 1:
              raise SystemExit(f'candidate_score anchor count: {text.count(old)}')
          resolver.write_text(text.replace(old, new, 1), encoding='utf-8')

          bore_test = Path('tests/test_bore_liquorix_port.py')
          text = bore_test.read_text(encoding='utf-8')
          text = text.replace(
              '"patches/testing/0001-linux{series}-rc*-bore-*.patch",',
              '"patches/testing/0001-linux{series}*-bore-*.patch",',
              1,
          ).replace(
              '"patches/stable/linux-{series}-bore/0001-linux{series}-rc*-bore-*.patch",',
              '"patches/stable/linux-{series}-bore/0001-linux{series}*-bore-*.patch",',
              1,
          )
          bore_test.write_text(text, encoding='utf-8')

          reflex = Path('scripts/apply-reflex-core.py')
          text = reflex.read_text(encoding='utf-8')
          text = text.replace(
              '# source implements cpufreq_default_governor() behind that symbol. If the selected patch does not add the symbol to the default-governor\n   # choice, complete\n  # that integration here before olddefconfig.',
              '# source implements cpufreq_default_governor() behind that symbol. If the\n  # selected patch does not add the default-governor choice, complete that\n  # integration here before olddefconfig.',
              1,
          )
          reflex.write_text(text, encoding='utf-8')
          PY
          python3 -m py_compile scripts/resolve-patch-sources.py scripts/apply-reflex-core.py
          scripts/validate-dynamic-patches-local.sh
          git diff --check
      - name: Commit correction
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/resolve-patch-sources.py scripts/apply-reflex-core.py tests/test_bore_liquorix_port.py
          git commit -m "Fix nearest kernel patch ordering"
          git push origin "HEAD:$HEAD_BRANCH"
