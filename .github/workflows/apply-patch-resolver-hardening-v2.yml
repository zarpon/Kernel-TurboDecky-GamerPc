name: Execute patch resolver hardening v2

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.head_ref == 'validation/patch-resolver-hardening-20260727'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply and test corrections
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/stage-patch-resolver-hardening.py
          python3 -m py_compile scripts/resolve-patch-sources.py scripts/apply-reflex-core.py scripts/apply-dynamic-patch-sources.py
          python3 tests/test_dynamic_patch_resolver.py
          python3 tests/test_reflex_dynamic_bootstrap.py
          git diff --check
      - name: Commit correction
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/resolve-patch-sources.py scripts/apply-reflex-core.py config/patch-sources.json tests/test_dynamic_patch_resolver.py tests/test_reflex_dynamic_bootstrap.py
          git commit -m "Harden dynamic patch resolution and REFLEX tracking"
          git push origin "HEAD:$HEAD_BRANCH"
