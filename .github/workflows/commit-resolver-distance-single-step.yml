name: Commit resolver correction in one validated step

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'validation/patch-resolver-hardening-20260727'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply, validate and commit correction
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/stage-resolver-distance-fix.py
          python3 -m py_compile scripts/resolve-patch-sources.py scripts/apply-reflex-core.py
          python3 tests/test_dynamic_patch_resolver.py
          python3 tests/test_bore_liquorix_port.py
          python3 tests/test_reflex_dynamic_bootstrap.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/resolve-patch-sources.py scripts/apply-reflex-core.py tests/test_bore_liquorix_port.py
          git commit -m "Fix nearest kernel patch ordering"
          git push origin "HEAD:$HEAD_BRANCH"
