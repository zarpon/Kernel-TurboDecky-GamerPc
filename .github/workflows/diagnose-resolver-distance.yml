name: Materialize validated resolver correction

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  materialize:
    if: github.head_ref == 'validation/patch-resolver-hardening-20260727'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply and validate corrected files
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/stage-resolver-distance-fix.py
          python3 -m py_compile scripts/resolve-patch-sources.py scripts/apply-reflex-core.py
          python3 tests/test_dynamic_patch_resolver.py
          python3 tests/test_bore_liquorix_port.py
          python3 tests/test_reflex_dynamic_bootstrap.py
          git diff --check
      - name: Upload validated corrected files
        uses: actions/upload-artifact@v4
        with:
          name: gamerpc-validated-resolver-files
          path: |
            scripts/resolve-patch-sources.py
            scripts/apply-reflex-core.py
            tests/test_bore_liquorix_port.py
          if-no-files-found: error
          retention-days: 3
