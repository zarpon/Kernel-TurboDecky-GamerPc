name: One-time legacy base removal

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Remove Liquorix and preserve the TurboDecky feature set
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import os
          import re

          ROOT = Path('.')

          def read(path):
              return (ROOT / path).read_text(encoding='utf-8')

          def write(path, text):
              (ROOT / path).write_text(text, encoding='utf-8')

          def replace_once(path, old, new):
              text = read(path)
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement anchor, found {count}: {old[:100]!r}')
              write(path, text.replace(old, new, 1))

          # Dynamic source manifest: Liquorix is no longer a source component.
          manifest_path = ROOT / 'config/patch-sources.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          removed = manifest['components'].pop('liquorix_config', None)
          if removed is None:
              raise SystemExit('config/patch-sources.json: liquorix_config component is missing')
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          # Core build: use the target kernel's own x86_64 defconfig, then merge
          # the versioned TurboDecky feature overlay. Keep the generic ADIOS
          # compatibility port, but remove all Liquorix-specific behavior/naming.
          core = 'scripts/build-kernelnote-core.sh'
          replace_once(core,
              'LIQUORIX_CONFIG_URL="https://raw.githubusercontent.com/damentz/liquorix-package/56f0e85662990ee20b4ea10465a41a23b65ace2c/linux-liquorix/debian/config/kernelarch-x86/config-arch-64"\n',
              '')
          replace_once(core,
              '# Keep the existing Liquorix built-in arguments and append these canonical\n# kernel parameters. CMDLINE_OVERRIDE stays disabled so bootloader parameters\n',
              '# Append the canonical TurboDecky built-in arguments.\n# CMDLINE_OVERRIDE stays disabled so bootloader parameters\n')
          replace_once(core,
              'echo "==> Applying ADIOS with Liquorix compatibility handling"',
              'echo "==> Applying ADIOS with target-kernel compatibility handling"')
          replace_once(core,
              'python3 "$ROOT/scripts/apply-adios-liquorix.py" "$KERNELDIR"',
              'python3 "$ROOT/scripts/apply-adios-default-elevator-port.py" "$KERNELDIR"')
          replace_once(core,
              'download "$LIQUORIX_CONFIG_URL" "$WORKDIR/liquorix-amd64.config"\n',
              '')
          replace_once(core,
              'cp "$WORKDIR/liquorix-amd64.config" .config\n',
              'echo "==> Generating upstream x86-64 base configuration"\n"${MAKE[@]}" x86_64_defconfig\nscripts/kconfig/merge_config.sh -m .config "$ROOT/config/kernelnote.config"\n')
          replace_once(core,
              '# Reproducible generic AMD64 build for LMDE. Avoid distro certificate paths and\n# Rust toolchain coupling from the upstream Liquorix generated configuration.\n',
              '# Reproducible generic AMD64 build. Avoid distro certificate paths and\n# optional Rust toolchain coupling in the hosted build environment.\n')
          replace_once(core,
              'scripts/config --set-str LOCALVERSION "-kernelnote-lqx-marie-bore-adios-thinlto"',
              'scripts/config --set-str LOCALVERSION "-kernelnote-marie-bore-adios-thinlto"')

          # Rename the ADIOS compatibility helper and make its semantics generic.
          old_helper = ROOT / 'scripts/apply-adios-liquorix.py'
          new_helper = ROOT / 'scripts/apply-adios-default-elevator-port.py'
          if not old_helper.is_file() or new_helper.exists():
              raise SystemExit('unexpected ADIOS helper rename state')
          helper = old_helper.read_text(encoding='utf-8')
          helper = helper.replace('Resolve the expected ADIOS default-elevator hunk on Liquorix 7.1.3.',
                                  'Resolve the expected ADIOS default-elevator hunk on the target Linux source.')
          helper = helper.replace('usage: apply-adios-liquorix.py /path/to/linux',
                                  'usage: apply-adios-default-elevator-port.py /path/to/linux')
          helper = helper.replace('Preserve Liquorix defaults when ADIOS is not selected globally.',
                                  'Preserve the target kernel defaults when ADIOS is not selected globally.')
          helper = helper.replace('Applied Liquorix compatibility for the ADIOS default elevator.',
                                  'Applied generic compatibility port for the ADIOS default elevator.')
          new_helper.write_text(helper, encoding='utf-8')
          old_helper.unlink()

          # Integration wrapper wording/localversion anchors.
          wrapper = 'scripts/build-kernelnote.sh'
          replace_once(wrapper,
              'Porting POC Selector across Liquorix/BORE offsets with fuzz <= 3',
              'Porting POC Selector across target-kernel/BORE offsets with fuzz <= 3')
          replace_once(wrapper,
              'Porting NAP 0.5.0 from Linux 6.18.3 to Liquorix Linux 7.1',
              'Porting NAP 0.5.0 from Linux 6.18.3 to the target Linux series')
          replace_once(wrapper,
              'scripts/config --set-str LOCALVERSION "-kernelnote-lqx-marie-bore-adios-thinlto"\\\n',
              'scripts/config --set-str LOCALVERSION "-kernelnote-marie-bore-adios-thinlto"\\\n')

          # Dynamic lock rewriter no longer expects or rewrites an external base config.
          dynamic = 'scripts/apply-dynamic-patch-sources.py'
          replace_once(dynamic,
              '    text = replace_assignment(text, "LIQUORIX_CONFIG_URL", file_url(component(lock, "liquorix_config")))\n',
              '')
          replace_once(dynamic,
              '        "vram", "liquorix_config", *REQUESTED.keys(),\n',
              '        "vram", *REQUESTED.keys(),\n')

          # Upstream generic rewriter now anchors on the upstream defconfig merge.
          upstream = 'scripts/apply-upstream-generic.py'
          replace_once(upstream,
              '    config_anchor = \'cp "$WORKDIR/liquorix-amd64.config" .config\\n\'\n',
              '    config_anchor = \'scripts/kconfig/merge_config.sh -m .config "$ROOT/config/kernelnote.config"\\n\'\n')
          replace_once(upstream,
              'source = replace_once(source, \'scripts/config --set-str LOCALVERSION "-kernelnote-lqx-marie-bore-adios-thinlto"\', \'scripts/config --set-str LOCALVERSION "-kernelnote-lqx-marie-bore-adios-fulllto"\', "Full LTO localversion marker")',
              'source = replace_once(source, \'scripts/config --set-str LOCALVERSION "-kernelnote-marie-bore-adios-thinlto"\', \'scripts/config --set-str LOCALVERSION "-kernelnote-marie-bore-adios-fulllto"\', "Full LTO localversion marker")')

          generic = 'scripts/apply-zarpon-generic-name.py'
          replace_once(generic,
              "        '-kernelnote-lqx-marie-bore-adios-thinlto',\n        '-kernelnote-lqx-marie-bore-adios-fulllto',\n",
              "        '-kernelnote-marie-bore-adios-thinlto',\n        '-kernelnote-marie-bore-adios-fulllto',\n")

          # Preserve BORE test coverage while removing the obsolete name.
          old_test = ROOT / 'tests/test_bore_liquorix_port.py'
          new_test = ROOT / 'tests/test_bore_port.py'
          if not old_test.is_file() or new_test.exists():
              raise SystemExit('unexpected BORE test rename state')
          new_test.write_bytes(old_test.read_bytes())
          old_test.unlink()
          replace_once('scripts/validate-dynamic-patches-local.sh',
              '  "$ROOT/tests/test_bore_liquorix_port.py" \\\n',
              '  "$ROOT/tests/test_bore_port.py" \\\n')

          # Rewriter fixture no longer fabricates the removed config component.
          dyn_test = 'tests/test_dynamic_patch_resolver.py'
          replace_once(dyn_test,
              '            git_names = {"bore", "bore_sched_ext_coexistence", "marie", "adios", "zram_ir", "poc", "nap", "reflex", "vram", "liquorix_config"}\n',
              '            git_names = {"bore", "bore_sched_ext_coexistence", "marie", "adios", "zram_ir", "poc", "nap", "reflex", "vram"}\n')
          replace_once(dyn_test,
              '            components["liquorix_config"]["kind"] = "git_file"\n            components["liquorix_config"]["output"] = "files/liquorix.config"\n',
              '')
          replace_once(dyn_test,
              '                if name == "liquorix_config":\n                    output.write_text("CONFIG_GENERIC_CPU=y\\\n", encoding="utf-8")\n                else:\n                    output.write_text(patch(f"{name} snapshot"), encoding="utf-8")\n',
              '                output.write_text(patch(f"{name} snapshot"), encoding="utf-8")\n')
          replace_once(dyn_test,
              '                \'LIQUORIX_CONFIG_URL="old"\\\nADIOS_URL="old"\\\n\'\n',
              '                \'ADIOS_URL="old"\\\n\'\n')

          # Documentation: base configuration is now entirely from the target Linux tree.
          replace_once('PATCH-SOURCES.md',
              'patches TTM/DMEM de VRAM, linux-tkg, CachyOS, OpenWrt e a configuração-base do\nLiquorix.\n',
              'patches TTM/DMEM de VRAM, linux-tkg, CachyOS e OpenWrt. A configuração-base\né gerada pelo `x86_64_defconfig` da própria árvore Linux-alvo.\n')
          replace_once('PATCH-AUDIT.md',
              'O GamerPC também contém componentes que não existiam no Charcoal, como VRAM/\nTTM e a configuração Liquorix genérica.\n',
              'O GamerPC também contém componentes que não existiam no Charcoal, como a\nintegração VRAM/TTM. A configuração-base vem diretamente da árvore Linux-alvo.\n')

          # README already had no literal Liquorix entry; document the new base explicitly
          # and align the documented Linux policy with the existing RC-aware resolver.
          replace_once('README.md',
              'O repositório `Kernel-TurboDecky-GamerPc` acompanha a versão estável mais\nrecente publicada pelo kernel.org.\n',
              'O repositório `Kernel-TurboDecky-GamerPc` acompanha a versão upstream mais\nrecente publicada pelo kernel.org, incluindo release candidates (RCs).\n')
          replace_once('README.md',
              'O build clona a tag `v<versão>` e confirma a versão pelo Makefile antes de\naplicar qualquer patch.\n',
              'O build clona a tag `v<versão>` e confirma a versão pelo Makefile antes de\naplicar qualquer patch. A configuração-base é gerada pelo `x86_64_defconfig`\nda própria árvore Linux-alvo e recebe as sobreposições versionadas em\n`config/kernelnote.config`.\n')
          replace_once('README.en.md',
              '`Kernel-TurboDecky-GamerPc` repository tracks the latest stable version\npublished by kernel.org.\n',
              '`Kernel-TurboDecky-GamerPc` repository tracks the newest upstream version\npublished by kernel.org, including release candidates (RCs).\n')
          replace_once('README.en.md',
              'The build clones the `v<version>` tag and verifies the version through the\nMakefile before applying any patch.\n',
              'The build clones the `v<version>` tag and verifies the version through the\nMakefile before applying any patch. The base configuration is generated from\nthe target Linux tree\'s own `x86_64_defconfig` and then merged with the\nversioned overrides in `config/kernelnote.config`.\n')

          # Remove this one-time workflow before the repository-wide invariant check.
          self_path = ROOT / '.github/workflows/remove-liquorix-once.yml'
          self_path.unlink()

          forbidden = []
          for path in ROOT.rglob('*'):
              if not path.is_file() or '.git' in path.parts:
                  continue
              if any(part in {'work', 'logs', '__pycache__'} for part in path.parts):
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              if re.search(r'liquorix', text, flags=re.I) or re.search(r'(?<![A-Za-z0-9])lqx(?![A-Za-z0-9])', text, flags=re.I):
                  forbidden.append(str(path))
          if forbidden:
              raise SystemExit('legacy references remain: ' + ', '.join(sorted(forbidden)))
          PY

          python3 -m json.tool config/patch-sources.json >/dev/null
          python3 -m py_compile scripts/*.py tests/*.py
          bash -n scripts/build-kernelnote-core.sh scripts/build-kernelnote.sh scripts/validate-dynamic-patches-local.sh
          python3 -m unittest -v tests/test_dynamic_patch_resolver.py tests/test_bore_port.py tests/test_manual_workflow_contract.py
          git diff --check

      - name: Commit the atomic cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "TurboDecky Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Remove Liquorix from TurboDecky build"
          git push origin HEAD:main

      - name: Start corrective full package and release build
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh workflow run validate-kernel.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            --field publish_release=true
