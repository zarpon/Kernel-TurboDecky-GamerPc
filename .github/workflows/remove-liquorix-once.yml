name: One-time legacy base removal

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Remove legacy base and preserve TurboDecky features
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('.')
          def get(p): return (root / p).read_text(encoding='utf-8')
          def put(p, s): (root / p).write_text(s, encoding='utf-8')
          def one(p, old, new):
              s = get(p)
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{p}: expected one anchor, found {n}: {old[:120]!r}')
              put(p, s.replace(old, new, 1))

          manifest_path = root / 'config/patch-sources.json'
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          if manifest['components'].pop('liquorix_config', None) is None:
              raise SystemExit('manifest component liquorix_config not found')
          manifest_path.write_text(json.dumps(manifest, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')

          core = 'scripts/build-kernelnote-core.sh'
          one(core, 'LIQUORIX_CONFIG_URL="https://raw.githubusercontent.com/damentz/liquorix-package/56f0e85662990ee20b4ea10465a41a23b65ace2c/linux-liquorix/debian/config/kernelarch-x86/config-arch-64"\n', '')
          one(core, '# Keep the existing Liquorix built-in arguments and append these canonical\n# kernel parameters. CMDLINE_OVERRIDE stays disabled so bootloader parameters\n', '# Append the canonical TurboDecky built-in arguments.\n# CMDLINE_OVERRIDE stays disabled so bootloader parameters\n')
          one(core, 'echo "==> Applying ADIOS with Liquorix compatibility handling"', 'echo "==> Applying ADIOS with target-kernel compatibility handling"')
          one(core, 'python3 "$ROOT/scripts/apply-adios-liquorix.py" "$KERNELDIR"', 'python3 "$ROOT/scripts/apply-adios-default-elevator-port.py" "$KERNELDIR"')
          one(core, 'download "$LIQUORIX_CONFIG_URL" "$WORKDIR/liquorix-amd64.config"\n', '')
          one(core, 'cp "$WORKDIR/liquorix-amd64.config" .config\n', 'echo "==> Generating upstream x86-64 base configuration"\n"${MAKE[@]}" x86_64_defconfig\nscripts/kconfig/merge_config.sh -m .config "$ROOT/config/kernelnote.config"\n')
          one(core, '# Reproducible generic AMD64 build for LMDE. Avoid distro certificate paths and\n# Rust toolchain coupling from the upstream Liquorix generated configuration.\n', '# Reproducible generic AMD64 build. Avoid distro certificate paths and\n# optional Rust toolchain coupling in the hosted build environment.\n')
          one(core, '-kernelnote-lqx-marie-bore-adios-thinlto', '-kernelnote-marie-bore-adios-thinlto')

          old = root / 'scripts/apply-adios-liquorix.py'
          new = root / 'scripts/apply-adios-default-elevator-port.py'
          if not old.is_file() or new.exists(): raise SystemExit('unexpected ADIOS helper rename state')
          s = old.read_text(encoding='utf-8')
          changes = {
              'Resolve the expected ADIOS default-elevator hunk on Liquorix 7.1.3.': 'Resolve the expected ADIOS default-elevator hunk on the target Linux source.',
              'usage: apply-adios-liquorix.py /path/to/linux': 'usage: apply-adios-default-elevator-port.py /path/to/linux',
              'Preserve Liquorix defaults when ADIOS is not selected globally.': 'Preserve the target kernel defaults when ADIOS is not selected globally.',
              'Applied Liquorix compatibility for the ADIOS default elevator.': 'Applied generic compatibility port for the ADIOS default elevator.',
          }
          for a,b in changes.items():
              if s.count(a) != 1: raise SystemExit(f'ADIOS helper anchor count != 1: {a!r}')
              s = s.replace(a,b,1)
          new.write_text(s, encoding='utf-8'); old.unlink()

          wrapper = 'scripts/build-kernelnote.sh'
          one(wrapper, 'Porting POC Selector across Liquorix/BORE offsets with fuzz <= 3', 'Porting POC Selector across target-kernel/BORE offsets with fuzz <= 3')
          one(wrapper, 'Porting NAP 0.5.0 from Linux 6.18.3 to Liquorix Linux 7.1', 'Porting NAP 0.5.0 from Linux 6.18.3 to the target Linux series')
          one(wrapper, '-kernelnote-lqx-marie-bore-adios-thinlto', '-kernelnote-marie-bore-adios-thinlto')

          dynamic = 'scripts/apply-dynamic-patch-sources.py'
          one(dynamic, '    text = replace_assignment(text, "LIQUORIX_CONFIG_URL", file_url(component(lock, "liquorix_config")))\n', '')
          one(dynamic, '        "vram", "liquorix_config", *REQUESTED.keys(),\n', '        "vram", *REQUESTED.keys(),\n')

          upstream = 'scripts/apply-upstream-generic.py'
          one(upstream, '    config_anchor = \'cp "$WORKDIR/liquorix-amd64.config" .config\\n\'\n', '    config_anchor = \'scripts/kconfig/merge_config.sh -m .config "$ROOT/config/kernelnote.config"\\n\'\n')
          one(upstream, '-kernelnote-lqx-marie-bore-adios-thinlto', '-kernelnote-marie-bore-adios-thinlto')
          one(upstream, '-kernelnote-lqx-marie-bore-adios-fulllto', '-kernelnote-marie-bore-adios-fulllto')

          generic = 'scripts/apply-zarpon-generic-name.py'
          one(generic, '-kernelnote-lqx-marie-bore-adios-thinlto', '-kernelnote-marie-bore-adios-thinlto')
          one(generic, '-kernelnote-lqx-marie-bore-adios-fulllto', '-kernelnote-marie-bore-adios-fulllto')

          old = root / 'tests/test_bore_liquorix_port.py'; new = root / 'tests/test_bore_port.py'
          if not old.is_file() or new.exists(): raise SystemExit('unexpected BORE test rename state')
          new.write_bytes(old.read_bytes()); old.unlink()
          one('scripts/validate-dynamic-patches-local.sh', 'test_bore_liquorix_port.py', 'test_bore_port.py')

          # Keep the generic git_file materialization test, only remove its old identity.
          t = 'tests/test_dynamic_patch_resolver.py'
          s = get(t)
          fixture_changes = {
              'liquorix_config': 'generic_config_fixture',
              'liquorix.config': 'generic.config',
              'LIQUORIX_CONFIG_URL': 'GENERIC_CONFIG_URL',
          }
          for a,b in fixture_changes.items():
              if a not in s: raise SystemExit(f'dynamic resolver fixture anchor missing: {a}')
              s = s.replace(a,b)
          put(t,s)

          one('PATCH-SOURCES.md', 'patches TTM/DMEM de VRAM, linux-tkg, CachyOS, OpenWrt e a configuração-base do\nLiquorix.\n', 'patches TTM/DMEM de VRAM, linux-tkg, CachyOS e OpenWrt. A configuração-base\né gerada pelo `x86_64_defconfig` da própria árvore Linux-alvo.\n')
          one('PATCH-AUDIT.md', 'O GamerPC também contém componentes que não existiam no Charcoal, como VRAM/\nTTM e a configuração Liquorix genérica.\n', 'O GamerPC também contém componentes que não existiam no Charcoal, como a\nintegração VRAM/TTM. A configuração-base vem diretamente da árvore Linux-alvo.\n')

          one('README.md', 'O repositório `Kernel-TurboDecky-GamerPc` acompanha a versão estável mais\nrecente publicada pelo kernel.org.\n', 'O repositório `Kernel-TurboDecky-GamerPc` acompanha a versão upstream mais\nrecente publicada pelo kernel.org, incluindo release candidates (RCs).\n')
          one('README.md', 'O build clona a tag `v<versão>` e confirma a versão pelo Makefile antes de\naplicar qualquer patch.\n', 'O build clona a tag `v<versão>` e confirma a versão pelo Makefile antes de\naplicar qualquer patch. A configuração-base é gerada pelo `x86_64_defconfig`\nda própria árvore Linux-alvo e recebe as sobreposições versionadas em\n`config/kernelnote.config`.\n')
          one('README.en.md', '`Kernel-TurboDecky-GamerPc` repository tracks the latest stable version\npublished by kernel.org.\n', '`Kernel-TurboDecky-GamerPc` repository tracks the newest upstream version\npublished by kernel.org, including release candidates (RCs).\n')
          one('README.en.md', 'The build clones the `v<version>` tag and verifies the version through the\nMakefile before applying any patch.\n', 'The build clones the `v<version>` tag and verifies the version through the\nMakefile before applying any patch. The base configuration is generated from\nthe target Linux tree\'s own `x86_64_defconfig` and then merged with the\nversioned overrides in `config/kernelnote.config`.\n')

          (root / '.github/workflows/remove-liquorix-once.yml').unlink()
          bad=[]
          for p in root.rglob('*'):
              if not p.is_file() or '.git' in p.parts or any(x in {'work','logs','__pycache__'} for x in p.parts): continue
              try: s=p.read_text(encoding='utf-8')
              except UnicodeDecodeError: continue
              if re.search('liquorix', s, re.I) or re.search(r'(?<![A-Za-z0-9])lqx(?![A-Za-z0-9])', s, re.I): bad.append(str(p))
          if bad: raise SystemExit('legacy references remain: ' + ', '.join(sorted(bad)))
          PY
          python3 -m json.tool config/patch-sources.json >/dev/null
          python3 -m py_compile scripts/*.py tests/*.py
          bash -n scripts/build-kernelnote-core.sh scripts/build-kernelnote.sh scripts/validate-dynamic-patches-local.sh
          python3 -m unittest -v tests/test_dynamic_patch_resolver.py tests/test_bore_port.py tests/test_manual_workflow_contract.py
          git diff --check

      - name: Commit cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "TurboDecky Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Remove Liquorix from TurboDecky build"
          git push origin HEAD:main

      - name: Start corrective full package and release build
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          gh workflow run validate-kernel.yml --repo "$GITHUB_REPOSITORY" --ref main --field publish_release=true
