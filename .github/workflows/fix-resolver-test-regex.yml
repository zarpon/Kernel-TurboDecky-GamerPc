name: Correct resolver regression test version regex

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'validation/patch-resolver-hardening-20260727'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Fix, validate and commit test
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/test_dynamic_patch_resolver.py')
          text = path.read_text(encoding='utf-8')
          start = text.index('    def test_nearest_fallback_prefers_distance_over_newest_kernel')
          end = text.index('    def test_fallback_ref_restores_exact_series', start)
          section = text[start:end]
          old = 'r"demo-v([0-9.]+)"'
          new = 'r"demo-v([0-9]+(?:\\.[0-9]+)*)"'
          if section.count(old) != 1:
              raise SystemExit(f'expected one scoped regex anchor, found {section.count(old)}')
          section = section.replace(old, new, 1)
          path.write_text(text[:start] + section + text[end:], encoding='utf-8')
          PY
          python3 tests/test_dynamic_patch_resolver.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add tests/test_dynamic_patch_resolver.py
          git commit -m "Fix resolver regression version parsing"
          git push origin "HEAD:$HEAD_BRANCH"
