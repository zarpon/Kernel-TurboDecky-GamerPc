name: Apply dynamic SHA hardening

on:
  push:
    branches:
      - agent/bore-680-sha-hardening-20260728
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-bore-sha-hardening-gamerpc
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'agent/bore-680-sha-hardening-20260728' || github.ref_name == 'agent/bore-680-sha-hardening-20260728'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/bore-680-sha-hardening-20260728
          fetch-depth: 0

      - name: Apply deterministic transform
        run: python3 scripts/.apply-sha-hardening.py

      - name: Validate transformation
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m py_compile \
            scripts/resolve-patch-sources.py \
            scripts/validate-resolved-patches.py \
            tests/test-resolved-patch-integrity.py
          python3 tests/test-resolved-patch-integrity.py
          python3 -m json.tool config/patch-sources.json >/dev/null
          ! grep -Rq 'approved_sha256' config/patch-sources.json scripts/resolve-patch-sources.py
          ! grep -Fq '87b9b6f5bedc05db2fb59e921ca7cd172a2a68c1267834d5c5c771cc0f48fd36' .github/workflows/validate-kernel.yml config/patch-sources.json
          grep -Fq 'validate-resolved-patches.py' .github/workflows/validate-kernel.yml
          git diff --check

      - name: Commit validated changes
        env:
          BRANCH: agent/bore-680-sha-hardening-20260728
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Harden dynamic BORE SHA tracking'
          git push origin "HEAD:${BRANCH}"
