name: Apply dynamic SHA hardening

on:
  push:
    branches:
      - agent/bore-680-sha-hardening-20260728
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: apply-bore-sha-hardening-gamerpc
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'agent/bore-680-sha-hardening-20260728' || github.ref_name == 'agent/bore-680-sha-hardening-20260728'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/bore-680-sha-hardening-20260728
          fetch-depth: 0

      - name: Apply workflow hardening
        run: python3 scripts/.apply-ci-hardening.py

      - name: Validate workflow changes
        shell: bash
        run: |
          set -Eeuo pipefail
          grep -Fq 'validate-resolved-patches.py' .github/workflows/validate-kernel.yml
          grep -Fq 'BORE_VERSION=' .github/workflows/validate-kernel.yml
          ! grep -Fq '87b9b6f5bedc05db2fb59e921ca7cd172a2a68c1267834d5c5c771cc0f48fd36' .github/workflows/validate-kernel.yml
          git diff --check

      - name: Commit workflow hardening
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Validate dynamic patch bytes from lock'

      - name: Push workflow hardening
        env:
          BRANCH: agent/bore-680-sha-hardening-20260728
        run: git push origin "HEAD:${BRANCH}"
