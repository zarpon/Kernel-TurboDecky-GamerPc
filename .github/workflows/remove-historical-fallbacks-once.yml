name: One-time historical patch fallback cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Remove historical source fallbacks and enforce policy
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          manifest_path = Path('config/patch-sources.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          removed = []
          forbidden = ('fallback_refs', 'local_fallback_patch', 'local_fallback_metadata')
          for name, record in manifest['components'].items():
              for key in forbidden:
                  if key in record:
                      removed.append(f'{name}.{key}')
                      record.pop(key)
          if not removed:
              raise SystemExit('expected historical fallback entries to remove, found none')
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print('Removed manifest entries:', ', '.join(removed))

          for stale in (Path('patches/fallback/lru_marie.patch'), Path('patches/fallback/lru_marie.json')):
              if not stale.exists():
                  raise SystemExit(f'expected stale local fallback file: {stale}')
              stale.unlink()
          fallback_dir = Path('patches/fallback')
          if fallback_dir.exists() and not any(fallback_dir.iterdir()):
              fallback_dir.rmdir()

          resolver = Path('scripts/resolve-patch-sources.py')
          text = resolver.read_text(encoding='utf-8')
          anchor = '''    if manifest.get("schema") != 1 or not isinstance(manifest.get("components"), dict):
              raise SystemExit("unsupported patch source manifest")

          '''
          replacement = '''    if manifest.get("schema") != 1 or not isinstance(manifest.get("components"), dict):
              raise SystemExit("unsupported patch source manifest")

              # Historical refs and bundled local fallbacks can silently regress a
              # component after upstream moves forward. Resolve only current upstream;
              # cross-kernel candidates are allowed only when they belong to the current
              # upstream tree and can therefore be ported explicitly.
              forbidden_source_keys = {"fallback_refs", "local_fallback_patch", "local_fallback_metadata"}
              for component_name, component_record in manifest["components"].items():
                  stale_keys = sorted(forbidden_source_keys.intersection(component_record))
                  if stale_keys:
                      raise SystemExit(
                          f"historical patch fallback is forbidden for {component_name}: "
                          + ", ".join(stale_keys)
                      )

          '''
          # Normalize indentation introduced by YAML literal nesting.
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines()) + '\n'
          if text.count(anchor) != 1:
              raise SystemExit(f'resolver manifest validation anchor count={text.count(anchor)}')
          resolver.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')

          tests = Path('tests/test_dynamic_patch_resolver.py')
          t = tests.read_text(encoding='utf-8')
          pattern = re.compile(
              r'    def test_newer_current_release_outranks_older_exact_fallback_ref\(self\) -> None:\n.*?(?=\n    def test_git_symlink_patch_is_followed)',
              re.S,
          )
          match = pattern.search(t)
          if not match:
              raise SystemExit('fallback-ref resolver test block not found')
          new_test = '''    def test_historical_fallback_refs_are_rejected(self) -> None:
              with tempfile.TemporaryDirectory() as tmp:
                  tmp = Path(tmp)
                  repo = tmp / "repo"
                  init_repo(repo, {"patches/7.1/demo-v2.0.patch": patch("demo 2.0")})
                  manifest = {
                      "schema": 1,
                      "components": {
                          "demo": {
                              "kind": "git_patch",
                              "repo": str(repo),
                              "ref": "main",
                              "fallback_refs": ["a" * 40],
                              "exact_globs": ["patches/{series}/demo-*.patch"],
                              "fallback_globs": ["patches/*/demo-*.patch"],
                              "require_exact_series": False,
                              "output": "demo.patch",
                              "project_version_regex": r"demo-v([0-9.]+)",
                          }
                      },
                  }
                  manifest_path = tmp / "manifest.json"
                  manifest_path.write_text(json.dumps(manifest), encoding="utf-8")
                  result = subprocess.run(
                      [
                          "python3", str(RESOLVER), "--manifest", str(manifest_path),
                          "--output-dir", str(tmp / "resolved"), "--kernel-version", "7.1.3",
                          "--kernel-series", "7.1",
                      ],
                      text=True,
                      capture_output=True,
                  )
                  self.assertNotEqual(result.returncode, 0)
                  self.assertIn("historical patch fallback is forbidden", result.stderr)
          '''
          new_test = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_test.splitlines())
          tests.write_text(t[:match.start()] + new_test + t[match.end():], encoding='utf-8')

          Path('.github/workflows/remove-historical-fallbacks-once.yml').unlink()
          PY

          python3 -m json.tool config/patch-sources.json >/dev/null
          python3 -m py_compile scripts/*.py tests/*.py
          bash -n scripts/build-kernelnote-core.sh scripts/build-kernelnote.sh
          scripts/validate-dynamic-patches-local.sh
          if grep -RniE 'fallback_refs|local_fallback_(patch|metadata)' \
              --exclude-dir=.git --exclude-dir=work --exclude-dir=logs --exclude-dir=__pycache__ \
              config scripts patches; then
            echo 'Historical patch fallback mechanism remains in production sources' >&2
            exit 1
          fi
          git diff --check

      - name: Commit cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "TurboDecky Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Remove historical patch fallbacks"
          git push origin HEAD:main

      - name: Start corrective full release build
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          sleep 3
          gh workflow run validate-kernel.yml --repo "$GITHUB_REPOSITORY" --ref main --field publish_release=true
