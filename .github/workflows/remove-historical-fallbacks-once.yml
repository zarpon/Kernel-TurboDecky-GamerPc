name: One-time historical patch fallback cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Remove historical source fallbacks and enforce policy
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          manifest_path = Path("config/patch-sources.json")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          forbidden = {"fallback_refs", "local_fallback_patch", "local_fallback_metadata"}
          removed = []
          for name, record in manifest["components"].items():
              for key in sorted(forbidden):
                  if key in record:
                      removed.append(f"{name}.{key}")
                      del record[key]
          if not removed:
              raise SystemExit("expected historical fallback entries to remove, found none")
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print("Removed manifest entries:", ", ".join(removed))

          stale_paths = [
              Path("patches/fallback/lru_marie.patch"),
              Path("patches/fallback/lru_marie.json"),
              Path("scripts/update-marie-fallback.py"),
              Path("scripts/validate-marie-fallback.py"),
              Path("tests/test_marie_local_fallback.py"),
              Path("tests/test_marie_fallback_updater.py"),
          ]
          for stale in stale_paths:
              if not stale.exists():
                  raise SystemExit(f"expected historical fallback path: {stale}")
              stale.unlink()
          fallback_dir = Path("patches/fallback")
          if fallback_dir.exists() and not any(fallback_dir.iterdir()):
              fallback_dir.rmdir()

          base_path = Path("scripts/resolve-patch-sources-base.py")
          base = base_path.read_text(encoding="utf-8")
          base, count = re.subn(r"\ndef load_local_fallback\(.*?(?=\ndef resolve\()", "\n", base, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f"local fallback function removal count={count}")

          old_refs = '                refs = [spec.get("ref", "main"), *spec.get("fallback_refs", [])]\n'
          if base.count(old_refs) != 1:
              raise SystemExit(f"fallback_refs assignment count={base.count(old_refs)}")
          base = base.replace(old_refs, '                refs = [spec.get("ref", "main")]\n', 1)

          no_options_lines = [
              "                if not options:",
              '                    detail = " | ".join(ref_errors) if ref_errors else "no matching paths"',
              '                    expectation = "exact " if spec.get("require_exact_series", False) else ""',
              "                    raise ResolverError(",
              '                        f"no {expectation}compatible current-upstream path found for {component} and Linux "',
              '                        f"{series_text}: {detail}; port the newest upstream release"',
              "                    )",
          ]
          no_options = "\n".join(no_options_lines) + "\n"
          no_options_pattern = r"                if not options:\n                    fallback = load_local_fallback\(.*?(?=                else:\n                    _, repo_path, commit, ref, mode, selected, resolved_path = max\()"
          base, count = re.subn(no_options_pattern, lambda match: no_options, base, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f"local fallback call removal count={count}")

          base = base.replace('                            "selection": mode if ref == refs[0] else f"{mode}-fallback-ref",\n', '                            "selection": mode,\n')
          base = base.replace("fixed fallback metadata remains independently\n                        # checked by load_local_fallback().", "integrity is captured in patch-lock.json.")

          resolve_start = base.index("def resolve(")
          policy_anchor = ') -> dict[str, Any]:\n    temp_root = Path(tempfile.mkdtemp(prefix="patch-resolver-", dir=output_dir.parent))\n'
          policy_pos = base.index(policy_anchor, resolve_start)
          policy_lines = [
              ') -> dict[str, Any]:',
              '    forbidden_source_keys = {"fallback_refs", "local_fallback_patch", "local_fallback_metadata"}',
              '    for component_name, component_record in manifest.get("components", {}).items():',
              '        stale_keys = sorted(forbidden_source_keys.intersection(component_record))',
              '        if stale_keys:',
              '            raise ResolverError(',
              '                f"historical patch fallback is forbidden for {component_name}: "',
              '                + ", ".join(stale_keys)',
              '            )',
              '',
              '    temp_root = Path(tempfile.mkdtemp(prefix="patch-resolver-", dir=output_dir.parent))',
          ]
          policy = "\n".join(policy_lines) + "\n"
          base = base[:policy_pos] + policy + base[policy_pos + len(policy_anchor):]
          base_path.write_text(base, encoding="utf-8")

          core_path = Path("scripts/build-kernelnote-core.sh")
          core = core_path.read_text(encoding="utf-8")
          core_lines = [
              line for line in core.splitlines()
              if not line.startswith("MARIE_FALLBACK_PATCH=")
              and not line.startswith("MARIE_FALLBACK_METADATA=")
          ]
          core = "\n".join(core_lines) + "\n"
          marie_start = core.index("fetch_marie_testing_patch() {")
          marie_end = core.index("\nfetch_bore_source() {", marie_start)
          marie_lines = [
              "fetch_marie_testing_patch() {",
              '  echo "==> Fetching pinned Marie LRU $PATCH_MARIE_VERSION testing source locally"',
              '  rm -rf "$MARIEDIR"',
              '  git init --quiet "$MARIEDIR"',
              '  git -C "$MARIEDIR" remote add origin "$MARIE_REPO"',
              '  git -C "$MARIEDIR" config remote.origin.promisor true',
              '  git -C "$MARIEDIR" config remote.origin.partialclonefilter blob:none',
              '  git -C "$MARIEDIR" fetch --no-tags --depth=1 --filter=blob:none origin "$MARIE_COMMIT" 2>&1 | tee "$LOGDIR/02-lru-marie-fetch.log"',
              '  git -C "$MARIEDIR" show "FETCH_HEAD:$MARIE_PATCH_PATH" > "$MARIE_PATCH"',
              '  test -s "$MARIE_PATCH"',
              "  grep -Fq 'lru_marie' \"$MARIE_PATCH\"",
              "  grep -Fq 'LRU_MARIE' \"$MARIE_PATCH\"",
              '',
              '  {',
              '    echo "Marie source policy: current upstream testing release only"',
              '    echo "Repository: firelzrd/lru_marie"',
              '    echo "Commit: $MARIE_COMMIT"',
              '    echo "Version: $PATCH_MARIE_VERSION"',
              '    echo "Path: $MARIE_PATCH_PATH"',
              '    echo "SHA256: $(sha256sum \"$MARIE_PATCH\" | awk \'{print $1}\')"',
              '    echo "Acquisition: pinned current-upstream partial Git checkout; no local fallback"',
              '  } | tee "$LOGDIR/02-lru-marie-provenance.txt"',
              '}',
          ]
          marie_function = "\n".join(marie_lines) + "\n"
          core = core[:marie_start] + marie_function + core[marie_end + 1:]
          old_apply = '  echo "==> Applying local Marie LRU $PATCH_MARIE_VERSION testing patch for Linux 7.1"'
          new_apply = '  echo "==> Applying Marie LRU $PATCH_MARIE_VERSION upstream testing patch"'
          if core.count(old_apply) != 1:
              raise SystemExit(f"Marie apply message anchor count={core.count(old_apply)}")
          core = core.replace(old_apply, new_apply, 1)
          core_path.write_text(core, encoding="utf-8")

          tests_path = Path("tests/test_dynamic_patch_resolver.py")
          tests = tests_path.read_text(encoding="utf-8")
          pattern = re.compile(r"    def test_newer_current_release_outranks_older_exact_fallback_ref\(self\) -> None:\n.*?(?=\n    def test_git_symlink_patch_is_followed)", re.S)
          match = pattern.search(tests)
          if not match:
              raise SystemExit("historical fallback-ref test block not found")
          test_lines = [
              "    def test_historical_fallback_refs_are_rejected(self) -> None:",
              "        with tempfile.TemporaryDirectory() as tmp:",
              "            tmp = Path(tmp)",
              '            repo = tmp / "repo"',
              '            init_repo(repo, {"patches/7.1/demo-v2.0.patch": patch("demo 2.0")})',
              "            manifest = {",
              '                "schema": 1,',
              '                "components": {',
              '                    "demo": {',
              '                        "kind": "git_patch",',
              '                        "repo": str(repo),',
              '                        "ref": "main",',
              '                        "fallback_refs": ["a" * 40],',
              '                        "exact_globs": ["patches/{series}/demo-*.patch"],',
              '                        "fallback_globs": ["patches/*/demo-*.patch"],',
              '                        "require_exact_series": False,',
              '                        "output": "demo.patch",',
              '                        "project_version_regex": r"demo-v([0-9.]+)",',
              "                    }",
              "                },",
              "            }",
              '            manifest_path = tmp / "manifest.json"',
              '            manifest_path.write_text(json.dumps(manifest), encoding="utf-8")',
              "            result = subprocess.run(",
              "                [",
              '                    "python3", str(RESOLVER), "--manifest", str(manifest_path),',
              '                    "--output-dir", str(tmp / "resolved"), "--kernel-version", "7.1.3",',
              '                    "--kernel-series", "7.1",',
              "                ],",
              "                text=True,",
              "                capture_output=True,",
              "            )",
              "            self.assertNotEqual(result.returncode, 0)",
              '            self.assertIn("historical patch fallback is forbidden", result.stderr)',
          ]
          new_test = "\n".join(test_lines) + "\n"
          tests = tests[:match.start()] + new_test + tests[match.end():]
          old_expectation = 'self.assertIn("no exact compatible path", result.stderr)'
          new_expectation = 'self.assertIn("no exact compatible current-upstream path", result.stderr)'
          if tests.count(old_expectation) != 1:
              raise SystemExit(f"exact-required expectation count={tests.count(old_expectation)}")
          tests_path.write_text(tests.replace(old_expectation, new_expectation, 1), encoding="utf-8")

          marie_test_path = Path("tests/test_marie_version_reporting.py")
          marie_test_lines = [
              "#!/usr/bin/env python3",
              "from __future__ import annotations",
              "",
              "import unittest",
              "from pathlib import Path",
              "",
              "ROOT = Path(__file__).resolve().parents[1]",
              "",
              "",
              "class MarieVersionReportingTest(unittest.TestCase):",
              "    def test_build_uses_current_upstream_without_local_fallback(self) -> None:",
              '        core = (ROOT / "scripts/build-kernelnote-core.sh").read_text(encoding="utf-8")',
              '        self.assertIn("Fetching pinned Marie LRU $PATCH_MARIE_VERSION testing source locally", core)',
              '        self.assertIn("Marie source policy: current upstream testing release only", core)',
              '        self.assertIn("Applying Marie LRU $PATCH_MARIE_VERSION upstream testing patch", core)',
              '        self.assertNotIn("MARIE_FALLBACK_PATCH", core)',
              '        self.assertNotIn("MARIE_FALLBACK_METADATA", core)',
              '        self.assertNotIn("using maintained local fallback", core)',
              '        self.assertNotIn("validate-marie-fallback.py", core)',
              "",
              "    def test_dynamic_rewriter_sets_locked_marie_version(self) -> None:",
              '        rewriter = (ROOT / "scripts/apply-dynamic-patch-sources.py").read_text(encoding="utf-8")',
              '        self.assertIn(\'replace_assignment(text, "PATCH_MARIE_VERSION", versions["MARIE"])\', rewriter)',
              "",
              "    def test_audit_requires_upstream_only_marie(self) -> None:",
              '        audit = (ROOT / "PATCH-AUDIT.md").read_text(encoding="utf-8")',
              '        self.assertIn("sem fallback local", audit)',
              '        self.assertNotIn("fallback local é sincronizado automaticamente", audit)',
              "",
              "",
              'if __name__ == "__main__":',
              "    unittest.main()",
          ]
          marie_test_path.write_text("\n".join(marie_test_lines) + "\n", encoding="utf-8")

          audit_path = Path("PATCH-AUDIT.md")
          audit = audit_path.read_text(encoding="utf-8")
          old_marie = "| Marie LRU 0.6.7 | `marie` | Coberto por resolução dinâmica; o fallback local é sincronizado automaticamente com a versão upstream compatível mais recente |"
          new_marie = "| Marie LRU | `marie` | Coberto por resolução dinâmica da versão upstream mais nova; ausência da fonte upstream aborta o build, sem fallback local |"
          if audit.count(old_marie) != 1:
              raise SystemExit(f"Marie audit row count={audit.count(old_marie)}")
          audit = audit.replace(old_marie, new_marie, 1)
          audit = audit.replace("| POC Selector 2.6.1r2 | `poc` | Coberto por versão mais nova compatível, atualmente 2.6.2r2 |", "| POC Selector | `poc` | Coberto por resolução dinâmica da versão upstream mais nova e port controlado quando necessário |")
          audit = audit.replace("| ADIOS 3.2.0 e patch de default | `adios` | Coberto; default ADIOS continua explícito |", "| ADIOS e patch de default | `adios` | Coberto por resolução dinâmica da versão upstream mais nova; default ADIOS continua explícito |")
          audit_path.write_text(audit, encoding="utf-8")

          validation_path = Path("scripts/validate-dynamic-patches-local.sh")
          lines = validation_path.read_text(encoding="utf-8").splitlines()
          drop_markers = (
              "update-marie-fallback.py",
              "validate-marie-fallback.py",
              "test_marie_local_fallback.py",
              "test_marie_fallback_updater.py",
              "grep -Fq 'fallback_refs'",
              "grep -Fq 'local_fallback_patch'",
              'test -s "$ROOT/patches/fallback/lru_marie.patch"',
              '--patch "$ROOT/patches/fallback/lru_marie.patch"',
              '--metadata "$ROOT/patches/fallback/lru_marie.json"',
          )
          lines = [line for line in lines if not any(marker in line for marker in drop_markers)]
          lock_index = next(i for i, line in enumerate(lines) if "grep -Fq 'patch-lock.json'" in line)
          absence_lines = [
              "! grep -Fq 'fallback_refs' \"$ROOT/config/patch-sources.json\"",
              "! grep -Fq 'local_fallback_patch' \"$ROOT/config/patch-sources.json\"",
              "! grep -Fq 'local_fallback_metadata' \"$ROOT/config/patch-sources.json\"",
              'test ! -e "$ROOT/patches/fallback/lru_marie.patch"',
              'test ! -e "$ROOT/patches/fallback/lru_marie.json"',
              "! grep -Fq 'MARIE_FALLBACK_' \"$ROOT/scripts/build-kernelnote-core.sh\"",
              "! grep -Fq 'using maintained local fallback' \"$ROOT/scripts/build-kernelnote-core.sh\"",
              "grep -Fq 'historical patch fallback is forbidden' \"$ROOT/scripts/resolve-patch-sources-base.py\"",
          ]
          lines[lock_index:lock_index] = absence_lines
          validation_path.write_text("\n".join(lines) + "\n", encoding="utf-8")

          Path(".github/workflows/remove-historical-fallbacks-once.yml").unlink()
          PY

          python3 -m json.tool config/patch-sources.json >/dev/null
          python3 -m py_compile scripts/*.py tests/*.py
          bash -n scripts/build-kernelnote-core.sh scripts/build-kernelnote.sh scripts/validate-dynamic-patches-local.sh
          scripts/validate-dynamic-patches-local.sh
          if grep -RniE 'local_fallback_(patch|metadata)|load_local_fallback|update-marie-fallback|validate-marie-fallback|MARIE_FALLBACK_' \
              --exclude-dir=.git --exclude-dir=work --exclude-dir=logs --exclude-dir=__pycache__ \
              config scripts patches; then
            echo 'Historical patch fallback mechanism remains in production sources' >&2
            exit 1
          fi
          if grep -Fq 'fallback local é sincronizado automaticamente' PATCH-AUDIT.md; then
            echo 'Stale Marie fallback documentation remains' >&2
            exit 1
          fi
          git diff --check

      - name: Commit cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "TurboDecky Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Remove historical patch fallback paths"
          git push origin HEAD:main

      - name: Start corrective full release build
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          sleep 3
          gh workflow run validate-kernel.yml --repo "$GITHUB_REPOSITORY" --ref main --field publish_release=true
