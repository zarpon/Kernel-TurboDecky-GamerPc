name: One-time historical patch fallback cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Remove historical source fallbacks and enforce policy
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re

          # 1. Production manifest: current upstream only. Cross-kernel globs remain
          # available solely as a source for an explicit port of the current release.
          manifest_path = Path('config/patch-sources.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          forbidden = {'fallback_refs', 'local_fallback_patch', 'local_fallback_metadata'}
          removed = []
          for name, record in manifest['components'].items():
              for key in sorted(forbidden):
                  if key in record:
                      removed.append(f'{name}.{key}')
                      del record[key]
          if not removed:
              raise SystemExit('expected historical fallback entries to remove, found none')
          manifest_path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print('Removed manifest entries:', ', '.join(removed))

          # 2. Remove bundled old Marie snapshot and the tooling/tests that maintained it.
          stale_paths = [
              Path('patches/fallback/lru_marie.patch'),
              Path('patches/fallback/lru_marie.json'),
              Path('scripts/update-marie-fallback.py'),
              Path('scripts/validate-marie-fallback.py'),
              Path('tests/test_marie_local_fallback.py'),
              Path('tests/test_marie_fallback_updater.py'),
          ]
          for stale in stale_paths:
              if not stale.exists():
                  raise SystemExit(f'expected historical fallback path: {stale}')
              stale.unlink()
          fallback_dir = Path('patches/fallback')
          if fallback_dir.exists() and not any(fallback_dir.iterdir()):
              fallback_dir.rmdir()

          # 3. Base resolver: delete the local-fallback implementation and stop walking
          # historical refs. Reject those keys if anyone reintroduces them later.
          base_path = Path('scripts/resolve-patch-sources-base.py')
          base = base_path.read_text(encoding='utf-8')

          fn_start = base.index('\ndef load_local_fallback(')
          fn_end = base.index('\ndef resolve(', fn_start)
          base = base[:fn_start] + '\n' + base[fn_end:]

          old_refs = '                refs = [spec.get("ref", "main"), *spec.get("fallback_refs", [])]\n'
          if base.count(old_refs) != 1:
              raise SystemExit(f'fallback_refs resolver assignment count={base.count(old_refs)}')
          base = base.replace(old_refs, '                refs = [spec.get("ref", "main")]\n', 1)

          no_options_start = base.index(
              '                if not options:\n                    fallback = load_local_fallback('
          )
          no_options_end = base.index(
              '                else:\n                    _, repo_path, commit, ref, mode, selected, resolved_path = max(',
              no_options_start,
          )
          no_options = '''                if not options:
                    detail = " | ".join(ref_errors) if ref_errors else "no matching paths"
                    expectation = "exact " if spec.get("require_exact_series", False) else ""
                    raise ResolverError(
                        f"no {expectation}compatible current-upstream path found for {component} and Linux "
                        f"{series_text}: {detail}; port the newest upstream release"
                    )
'''
          base = base[:no_options_start] + no_options + base[no_options_end:]
          base = base.replace(
              '                            "selection": mode if ref == refs[0] else f"{mode}-fallback-ref",\n',
              '                            "selection": mode,\n',
          )
          base = base.replace(
              '                        # Integrity is recorded from the downloaded bytes in the\n'
              '                        # generated lock; fixed fallback metadata remains independently\n'
              '                        # checked by load_local_fallback().\n',
              '                        # Integrity is recorded from the downloaded bytes in the generated lock.\n',
          )

          resolve_anchor = '''def resolve(
    manifest: dict[str, Any],
    output_dir: Path,
    kernel: KernelVersion,
    series_text: str,
    manifest_root: Path | None = None,
) -> dict[str, Any]:
    temp_root = Path(tempfile.mkdtemp(prefix="patch-resolver-", dir=output_dir.parent))
'''
          resolve_replacement = '''def resolve(
    manifest: dict[str, Any],
    output_dir: Path,
    kernel: KernelVersion,
    series_text: str,
    manifest_root: Path | None = None,
) -> dict[str, Any]:
    forbidden_source_keys = {"fallback_refs", "local_fallback_patch", "local_fallback_metadata"}
    for component_name, component_record in manifest.get("components", {}).items():
        stale_keys = sorted(forbidden_source_keys.intersection(component_record))
        if stale_keys:
            raise ResolverError(
                f"historical patch fallback is forbidden for {component_name}: "
                + ", ".join(stale_keys)
            )

    temp_root = Path(tempfile.mkdtemp(prefix="patch-resolver-", dir=output_dir.parent))
'''
          if base.count(resolve_anchor) != 1:
              raise SystemExit(f'resolve() policy anchor count={base.count(resolve_anchor)}')
          base = base.replace(resolve_anchor, resolve_replacement, 1)
          base_path.write_text(base, encoding='utf-8')

          # 4. Replace the old behavior test with a fail-closed policy test.
          tests_path = Path('tests/test_dynamic_patch_resolver.py')
          tests = tests_path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'    def test_newer_current_release_outranks_older_exact_fallback_ref\(self\) -> None:\n.*?(?=\n    def test_git_symlink_patch_is_followed)',
              re.S,
          )
          match = pattern.search(tests)
          if not match:
              raise SystemExit('historical fallback-ref test block not found')
          new_test = '''    def test_historical_fallback_refs_are_rejected(self) -> None:
        with tempfile.TemporaryDirectory() as tmp:
            tmp = Path(tmp)
            repo = tmp / "repo"
            init_repo(repo, {"patches/7.1/demo-v2.0.patch": patch("demo 2.0")})
            manifest = {
                "schema": 1,
                "components": {
                    "demo": {
                        "kind": "git_patch",
                        "repo": str(repo),
                        "ref": "main",
                        "fallback_refs": ["a" * 40],
                        "exact_globs": ["patches/{series}/demo-*.patch"],
                        "fallback_globs": ["patches/*/demo-*.patch"],
                        "require_exact_series": False,
                        "output": "demo.patch",
                        "project_version_regex": r"demo-v([0-9.]+)",
                    }
                },
            }
            manifest_path = tmp / "manifest.json"
            manifest_path.write_text(json.dumps(manifest), encoding="utf-8")
            result = subprocess.run(
                [
                    "python3", str(RESOLVER), "--manifest", str(manifest_path),
                    "--output-dir", str(tmp / "resolved"), "--kernel-version", "7.1.3",
                    "--kernel-series", "7.1",
                ],
                text=True,
                capture_output=True,
            )
            self.assertNotEqual(result.returncode, 0)
            self.assertIn("historical patch fallback is forbidden", result.stderr)
'''
          tests_path.write_text(tests[:match.start()] + new_test + tests[match.end():], encoding='utf-8')

          # 5. Validation contract: fallback absence is now mandatory.
          validation_path = Path('scripts/validate-dynamic-patches-local.sh')
          validation = validation_path.read_text(encoding='utf-8')
          for obsolete in (
              '  "$ROOT/scripts/update-marie-fallback.py" \\\n',
              '  "$ROOT/scripts/validate-marie-fallback.py" \\\n',
              '  "$ROOT/tests/test_marie_local_fallback.py" \\\n',
              '  "$ROOT/tests/test_marie_fallback_updater.py" \\\n',
          ):
              if obsolete not in validation:
                  raise SystemExit(f'validation contract line missing: {obsolete!r}')
              validation = validation.replace(obsolete, '', 1)

          old_contract = '''grep -Fq '"vram"' "$ROOT/config/patch-sources.json"
grep -Fq 'fallback_refs' "$ROOT/config/patch-sources.json"
grep -Fq 'local_fallback_patch' "$ROOT/config/patch-sources.json"
test -s "$ROOT/patches/fallback/lru_marie.patch"
python3 "$ROOT/scripts/validate-marie-fallback.py" \\
  --patch "$ROOT/patches/fallback/lru_marie.patch" \\
  --metadata "$ROOT/patches/fallback/lru_marie.json"
grep -Fq 'patch-lock.json' "$ROOT/scripts/apply-dynamic-patch-sources.py"
'''
          new_contract = '''grep -Fq '"vram"' "$ROOT/config/patch-sources.json"
! grep -Fq 'fallback_refs' "$ROOT/config/patch-sources.json"
! grep -Fq 'local_fallback_patch' "$ROOT/config/patch-sources.json"
! grep -Fq 'local_fallback_metadata' "$ROOT/config/patch-sources.json"
test ! -e "$ROOT/patches/fallback/lru_marie.patch"
test ! -e "$ROOT/patches/fallback/lru_marie.json"
grep -Fq 'historical patch fallback is forbidden' "$ROOT/scripts/resolve-patch-sources-base.py"
grep -Fq 'patch-lock.json' "$ROOT/scripts/apply-dynamic-patch-sources.py"
'''
          if validation.count(old_contract) != 1:
              raise SystemExit(f'old fallback validation block count={validation.count(old_contract)}')
          validation_path.write_text(validation.replace(old_contract, new_contract, 1), encoding='utf-8')

          # The migration workflow must not survive its own successful commit.
          Path('.github/workflows/remove-historical-fallbacks-once.yml').unlink()
          PY

          python3 -m json.tool config/patch-sources.json >/dev/null
          python3 -m py_compile scripts/*.py tests/*.py
          bash -n scripts/build-kernelnote-core.sh scripts/build-kernelnote.sh scripts/validate-dynamic-patches-local.sh
          scripts/validate-dynamic-patches-local.sh
          if grep -RniE 'fallback_refs|local_fallback_(patch|metadata)|load_local_fallback|update-marie-fallback|validate-marie-fallback' \
              --exclude-dir=.git --exclude-dir=work --exclude-dir=logs --exclude-dir=__pycache__ \
              config scripts patches; then
            echo 'Historical patch fallback mechanism remains in production sources' >&2
            exit 1
          fi
          git diff --check

      - name: Commit cleanup
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "TurboDecky Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Remove historical patch fallback paths"
          git push origin HEAD:main

      - name: Start corrective full release build
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          sleep 3
          gh workflow run validate-kernel.yml --repo "$GITHUB_REPOSITORY" --ref main --field publish_release=true
