name: Finalize upstream-only patch source cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write
  actions: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Apply already-validated cleanup and verify executable fallback absence
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import subprocess

          source_path = Path('.github/workflows/remove-historical-fallbacks-once.yml')
          source = source_path.read_text(encoding='utf-8')
          marker = "          python3 - <<'PY'\n"
          start = source.index(marker) + len(marker)
          end = source.index("\n          PY\n", start)
          block = source[start:end]
          script = '\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines()) + '\n'
          migration = Path('/tmp/upstream-only-migration.py')
          migration.write_text(script, encoding='utf-8')
          subprocess.run(['python3', str(migration)], check=True)
          Path('.github/workflows/finalize-fallback-cleanup.yml').unlink()
          PY

          python3 -m json.tool config/patch-sources.json >/dev/null
          python3 -m py_compile scripts/*.py tests/*.py
          bash -n scripts/build-kernelnote-core.sh scripts/build-kernelnote.sh scripts/validate-dynamic-patches-local.sh
          scripts/validate-dynamic-patches-local.sh

          if grep -RniE 'MARIE_FALLBACK_(PATCH|METADATA)=|def load_local_fallback\(|update-marie-fallback\.py|validate-marie-fallback\.py' \
              --exclude-dir=.git --exclude-dir=work --exclude-dir=logs --exclude-dir=__pycache__ \
              config scripts patches; then
            echo 'Executable historical fallback path remains' >&2
            exit 1
          fi
          test ! -e patches/fallback/lru_marie.patch
          test ! -e patches/fallback/lru_marie.json
          ! grep -Fq 'fallback local é sincronizado automaticamente' PATCH-AUDIT.md
          git diff --check

      - name: Commit upstream-only source policy
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "TurboDecky Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Enforce current upstream patch sources only"
          git push origin HEAD:main

      - name: Start corrective full package and release build
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          sleep 3
          gh workflow run validate-kernel.yml --repo "$GITHUB_REPOSITORY" --ref main --field publish_release=true
