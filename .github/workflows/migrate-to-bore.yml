name: Apply transactional BORE migration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: migrate-to-bore-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  migrate:
    if: ${{ github.head_ref == 'agent/replace-infinity-with-bore-testing' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out proposed branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Transform and validate BORE migration
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x scripts/validate-dynamic-patches-local.sh
          GITHUB_ACTIONS=false scripts/validate-dynamic-patches-local.sh

      - name: Commit validated non-workflow changes
        shell: bash
        run: |
          set -Eeuo pipefail
          # GITHUB_TOKEN may update repository contents but cannot modify workflow
          # files. Restore them here; the connector applies those two changes next.
          git restore --source=HEAD -- \
            .github/workflows/validate-kernel.yml \
            .github/workflows/migrate-to-bore.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git diff --cached --quiet && {
            echo "Migration produced no non-workflow changes" >&2
            exit 1
          }
          git commit -m "Replace Infinity with BORE testing scheduler"
          git push origin "HEAD:${GITHUB_HEAD_REF}"

      - name: Pack transaction state
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          tar --exclude=.git --exclude=bore-transaction-snapshot.tar.gz \
            -czf bore-transaction-snapshot.tar.gz .

      - name: Upload transaction diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bore-transaction-${{ github.run_id }}
          path: |
            logs/**
            bore-transaction-snapshot.tar.gz
          if-no-files-found: error
          retention-days: 14
