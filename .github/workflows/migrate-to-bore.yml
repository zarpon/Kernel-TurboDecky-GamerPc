name: Apply transactional BORE migration

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: migrate-to-bore-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  migrate:
    if: ${{ github.head_ref == 'agent/replace-infinity-with-bore-testing' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out proposed branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Transform, validate and commit BORE migration
        shell: bash
        run: |
          set -Eeuo pipefail
          chmod +x scripts/validate-dynamic-patches-local.sh
          scripts/validate-dynamic-patches-local.sh

      - name: Confirm committed branch state
        if: success()
        shell: bash
        run: |
          set -Eeuo pipefail
          git status --short

      - name: Pack transaction state
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          tar --exclude=.git --exclude=bore-transaction-snapshot.tar.gz \
            -czf bore-transaction-snapshot.tar.gz .

      - name: Upload transaction diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bore-transaction-${{ github.run_id }}
          path: |
            logs/**
            bore-transaction-snapshot.tar.gz
          if-no-files-found: error
          retention-days: 14
