name: Dispatch verified current HEAD once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/dispatch-current-head-once.yml

permissions:
  contents: write
  actions: write

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Remove one-time trigger and publish final HEAD
        shell: bash
        run: |
          set -Eeuo pipefail
          git config user.name "TurboDecky Maintenance"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/dispatch-current-head-once.yml
          git commit -m "Remove one-time corrective build trigger"
          git push origin HEAD:main

      - name: Wait for final main ref and dispatch full release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -Eeuo pipefail
          expected="$(git rev-parse HEAD)"
          visible=""
          for _ in $(seq 1 30); do
            visible="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
            if [[ "$visible" == "$expected" ]]; then
              break
            fi
            sleep 2
          done
          if [[ "$visible" != "$expected" ]]; then
            echo "main did not converge to expected commit: expected=$expected visible=$visible" >&2
            exit 1
          fi
          gh workflow run validate-kernel.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            --field publish_release=true
